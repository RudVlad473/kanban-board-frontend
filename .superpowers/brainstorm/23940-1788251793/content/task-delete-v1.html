<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>Task delete — v1</title>
<style>
/* ============================================================================
   TASK DELETE — the last `❌` in the matrix.

   DELETE IS OPTIMISTIC, AND THIS FILE FIRST SAID IT WAS NOT
   ---------------------------------------------------------
   The matrix, the gap list and this prototype's first draft all rested on one
   sentence: *"this is the one genuinely non-optimistic wait in the app — the
   card must stay until the server confirms."* It is false, and the code says
   so. `use-delete-task.ts` writes the cache in `onMutate`, snapshots the task
   with its subtasks and the id of the neighbour it followed, and restores it in
   `onError`. It carries its own `Decisions` block recording that it read
   *"deliberately NOT optimistic"* until **2026-09-02** and was reversed, for two
   reasons: the client snapshot really does hold everything needed to roll back,
   and leaving the hook on `refresh()` alone made the board segment uncacheable
   — a cached navigation replayed a payload predating the delete and the task
   came back.

   So the whole first build was designing a wait that does not exist. It is #62
   with the polarity flipped: that time I read shipping code and missed the
   decision that had superseded it; this time I read a spec and missed the code
   that had superseded IT. The rule that covers both: **when prose and code
   disagree, find the dated decision, because one of them is downstream of it.**

   WHAT AN OPTIMISTIC DELETE ACTUALLY HAS TO DESIGN
   ------------------------------------------------
   Not the wait — there isn't one. Pressing Delete closes the modal and closes
   the card's space on the same frame, and the request goes out behind that.
   What needs designing is the half nobody sees on a good day:

     THE RESTORE. A refusal has to put the task back where it was, and "where it
     was" is anchored to the neighbour it followed rather than to an index —
     the shipped hook stores `afterTaskId` for exactly this, so a concurrent
     insert cannot shift it. The motion is the collapse reversed BY RULE, not by
     replaying it backwards: the box opens first and the contents arrive at the
     end, because filling a box that is already open is two beats and arriving
     with it is one. `subtask-crud-v2` settled that asymmetry and this reuses it.

     THE TOAST. With the modal already gone there is nothing to write an inline
     error into, so the failure toast is right here — the opposite of the call
     the non-optimistic draft made, and for a reason that is entirely mechanical
     rather than a change of taste. The shipped hook already authors the copy per
     status, `NOT_FOUND` included, so the prototype quotes it rather than
     inventing new strings.

   WHAT IS RECORDED RATHER THAN BUILT
   ----------------------------------
   The first draft's patience threshold — show nothing loading-shaped for 400ms,
   and once shown hold it 260ms so the deferral does not just relocate the
   flash — was measured and is right. It simply does not apply to a mutation the
   user never waits on. It is kept in the defect log (#75) against the next
   surface that genuinely blocks, and deleted from here, because unused
   machinery in a prototype is read as a recommendation.

   TOAST MOTION IS BORROWED, NOT DESIGNED
   --------------------------------------
   G3 (toast enter/exit) is open. This uses the modal's approved curves at a
   smaller amplitude so the surface is complete enough to judge, and closing G3
   is still owed.

   THE COLLAPSE IS THE SUBTASK ROW'S, AND A FLIP WAS THE WRONG ANSWER
   ------------------------------------------------------------------
   The first build FLIPped: the card left flow and the cards below were slid
   past it on `translate`, which is compositor-cheap and looked like the right
   trade. It has a defect that the cheapness cannot pay for — the leaving card
   is still being painted while the others travel through the strip it occupies,
   so for the length of its fade **two cards overlap**. Reported as *"one task
   can live on top of another for a split second"*, and it is not tunable: the
   fade and the travel are different lengths by design, and the travel is the
   longer one.

   `subtask-crud-v2` had already settled this and been signed off on it. The
   card's WRAPPER collapses its height and margin to zero and the cards below
   are carried by layout, so nothing ever travels past anything. The two halves
   are sequenced — contents out over 90ms linear, then the box shuts over 200ms
   on the phase curve — because on one clock the front-loaded curve has the box
   at 9px while the opacity is still 0.58, which reads as the card being
   guillotined rather than leaving.

   The honest trade: this animates layout where the FLIP animated only the
   compositor. That is the price of not having two cards in one place, and it is
   one element's height in one column, not the whole board.
   ============================================================================ */

:root {
  --e: cubic-bezier(.2,0,0,1);
  /* an arrival's long decelerating tail; a dismissal's acceleration away */
  --enter: cubic-bezier(.16,1,.3,1);
  --exit: cubic-bezier(.5,0,.9,.4);
  --slow: 1;
  --purple: #635FC7;
  --purple-hover: #5854be;
  --purple-press: #4f4bab;
  --purple-edge: #3f3c85;
  --btn-quiet-hover: color-mix(in srgb, var(--ink) 4%, #fff);
  --btn-quiet-press: color-mix(in srgb, var(--ink) 8%, #fff);
  --btn-quiet-edge: color-mix(in srgb, #000 14%, #fff);
  --border-hover: #d6dfef;
  --border-rest: #dce3f2;
  --press: 90ms;
  --red: #EA5555;
  --ink: #000112;
  --muted: #828FA3;
  --line: #E4EBFA;
  --tint: #F4F7FD;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--tint); color: var(--ink);
  font: 500 13px/1.5 "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }
.page { display: flex; gap: 24px; padding: 24px; align-items: flex-start; }
.board { display: flex; gap: 24px; flex: 1 1 auto; }
.col { width: 280px; flex: none; }
.colhd { font: 700 12px/1 "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
  letter-spacing: 2.4px; text-transform: uppercase; color: var(--muted); margin: 0 0 24px; }
/*
 * NO `gap`. The spacing is a margin on a per-card WRAPPER, because `gap` is a
 * property of the container and cannot be animated for one item — a card whose
 * height collapses while its gap does not leaves a 20px hole that snaps shut a
 * frame later, and two closings in sequence is #40 in a different body.
 */
.cards { display: flex; flex-direction: column; }

/* ------------------------------------------------------------- the card */
.card { position: relative; background: #fff; border-radius: 8px; padding: 23px 16px;
  border: 1px solid var(--line); box-shadow: 0 1px 2px rgb(16 18 32 / .04);
  cursor: pointer; transition: box-shadow .13s, opacity calc(160ms * var(--slow)) var(--e); }
.card:hover { box-shadow: 0 2px 6px rgb(16 18 32 / .07); }
.ctitle { font: 700 15px/1.25 "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
  margin: 0 0 8px; padding-right: 28px; }
.csub { font: 700 12px/1 "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; color: var(--muted); }
/*
 * The kebab is `opacity: 0` and NOT `visibility: hidden` — #45: a hidden
 * control is still a control, and `visibility: hidden` took the subtask ✕ out
 * of the tab order, making delete mouse-only. `pointer-events: none` is what
 * stops it eating clicks; opacity alone would leave an invisible hit area.
 */
.kebab { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px;
  border: 0; background: none; color: var(--muted); border-radius: 4px; cursor: pointer;
  opacity: 0; pointer-events: none; transition: opacity .13s, background-color .13s; }
.card:hover .kebab, .kebab:focus-visible { opacity: 1; pointer-events: auto; }
.kebab:hover { background: var(--tint); color: var(--ink); }
.kebab:focus-visible { outline: 2px solid var(--purple); outline-offset: 1px; }

/*
 * THE REMOVAL IS THE SUBTASK ROW'S, NOT A FLIP — and the reason is a defect the
 * FLIP version actually had.
 *
 * A FLIP takes the leaving card OUT OF FLOW and slides the cards below past it.
 * The leaving card is still painted while that happens, so for the length of
 * its fade there are two cards occupying the same strip of column — one rising
 * through the other. Reported: *"one task can live on top of another for a
 * split second because the opacity isn't 0 when it moves up."* No amount of
 * tuning the fade fixes it; the two are simply on different clocks and the
 * slower one is the travel.
 *
 * `subtask-crud-v2` already solved this and was signed off on it. Nothing
 * travels: the wrapper's height closes and the cards below are carried by
 * layout, so there is never a moment when two of them overlap.
 *
 * The two halves are SEQUENCED, and this is the part that is easy to get wrong:
 *
 *   contents first  opacity to 0 over 90ms linear
 *   box second      height and margin to 0 over 200ms on the phase curve
 *
 * Both on one clock looked right and is not: `cubic-bezier(.2,0,0,1)` is so
 * front-loaded that at 85ms the box is 9px tall while a linear opacity is still
 * 0.58 — the card is being guillotined by a closing window rather than leaving.
 * Matching the curves inverts the fault instead of removing it: the row empties
 * in the first third and what remains is an empty box shrinking, which is #43's
 * hole. So the card goes, and then its space goes, and the tail of the gesture
 * is the space being reclaimed — which is the thing worth watching.
 *
 * The wrapper is what collapses, not the card: `height` cannot interpolate from
 * `auto`, and a height on the card itself would fight its own padding on the
 * way down and re-wrap the title mid-flight.
 */
.cardrow { overflow: hidden; margin-bottom: 20px; }
.cardrow:last-child { margin-bottom: 0; }
.cardrow.animating { transition:
    height calc(200ms * var(--slow)) var(--e),
    margin-bottom calc(200ms * var(--slow)) var(--e),
    opacity calc(90ms * var(--slow)) linear; }
/* Entering, the contents are DELAYED past the box rather than leading it. */
.cardrow.animating.entering { transition:
    height calc(200ms * var(--slow)) var(--e),
    margin-bottom calc(200ms * var(--slow)) var(--e),
    opacity calc(110ms * var(--slow)) linear calc(90ms * var(--slow)); }

/* ------------------------------------------------------- the wait itself */
/*
 * `pending` is `buttons-v4`'s own specified treatment: HOLD the pressed
 * geometry and drop to .75. It is not a new state to design — a button that
 * springs back up while its request is still in flight has un-said the thing
 * the press said.
 */
.btn.pending { opacity: .75; translate: 0 2px; cursor: default;
  box-shadow:
    inset 0 2px 3px rgb(0 0 0 / .24),
    inset 0 0 0 1px rgb(0 0 0 / .18),
    0 0 0 #862825; }
.btn.pending::after { opacity: 1; }
.btn[disabled] { cursor: default; }
.btn.ghost[disabled] { opacity: .5; }

/*
 * THE FAILURE TOAST. Border-led, per `toast-v3`'s option 3: 6px radius, a real
 * 1px border rather than a 4px left stripe, symmetric 16px, and an icon doing
 * the work the colour used to. The 6px follows the inputs, which this phase
 * moves from 4px — `toast-variants.ts` pins the toast to TextField's radius and
 * keeping 4px would silently break the rule that comment exists to protect.
 *
 * The MOTION here is borrowed from the modal, not designed: G3 is open.
 */
.toasts { position: fixed; right: 24px; bottom: 24px; z-index: 60;
  display: flex; flex-direction: column; gap: 12px; align-items: flex-end; }
.toast { width: 320px; background: #fff; border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--red) 34%, #fff);
  box-shadow: 0 1px 2px rgb(16 18 32 / .04), 0 12px 24px -12px rgb(16 18 32 / .18);
  padding: 16px; display: flex; gap: 11px;
  transition:
    opacity calc(90ms * var(--slow)) linear,
    translate calc(260ms * var(--slow)) var(--enter); }
.toast.in { opacity: 0; translate: 0 12px; }
.toast.out { opacity: 0; translate: 0 6px;
  transition:
    opacity calc(130ms * var(--slow)) var(--exit),
    translate calc(130ms * var(--slow)) var(--exit); }
.toast .ico { flex: none; width: 17px; height: 17px; color: var(--red); }
.toast .ico svg { width: 17px; height: 17px; display: block; }
.ttitle { font-size: 12px; font-weight: 700; line-height: 16px; }
.tdesc { font-size: 13px; font-weight: 500; line-height: 20px; color: var(--muted); margin-top: 8px; }

.mtitle { font: 700 18px/23px "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
  margin: 0 0 24px; color: var(--red); }
.mbody { font-size: 13px; line-height: 23px; color: var(--muted); margin: 0 0 24px; }
.mfoot { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pbody { padding: 24px; position: relative; }

/* Visible to a screen reader, to nothing else. Not `display: none`, which is
   not announced at all. */
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

/* ------------------------------------------------------------------- rig */
.rig { font: 500 12px/1.9 ui-monospace, monospace; color: #4a5568; width: 250px; flex: none; }
.rig h3 { font: 700 12px/1.4 "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; margin: 0 0 8px; }
.rig label { display: block; }
.rig p { margin: 10px 0 0; }

/* ------------------------------------------------------------- the modal */
/*
 * THE MOTION, RE-DERIVED — reported as "kinda basic", and it was: opacity +
 * 8px + scale .985, one 160ms budget, symmetric both ways. That is the default
 * recipe, and three specific things made it read as one.
 *
 *   1. OPACITY AND TRAVEL SHARED A CLOCK. A box that finishes fading exactly
 *      when it finishes moving is translucent for the whole of its travel, so
 *      the eye reads a fade and never an arriving object. Opacity now finishes
 *      at 90ms while translate and scale run to 300ms, and the split was tuned
 *      against the curve rather than picked: `--enter` front-loads so hard that
 *      a 150ms fade left **0.15px** of travel outstanding — measured, by
 *      scrubbing the running transition rather than sampling a wall clock.
 *      That is the same fade-and-arrive-together defect with larger numbers on
 *      it. At 90ms over 18px the popup is fully opaque with **2.2px** still to
 *      go, and those 2.2px take the remaining 210ms — a solid panel settling,
 *      which is the whole difference from a ghost drifting.
 *   2. THE CURVE HAD NO TAIL. `--e` is the phase's general-purpose curve. An
 *      arrival wants `--enter`, an expo-out: nearly all the distance covered
 *      at once, then a long decelerating settle. Same budget, different
 *      character.
 *   3. THE SCRIM WAS A FLAT WASH. It now blurs 0 → 1.5px as well, so the board
 *      behind actually recedes — depth from defocus rather than from a grey
 *      sheet laid over everything.
 *
 * The popup's SHADOW animates with it, starting tight and flat and ending on
 * the full lift, so it reads as rising toward the viewer — the one depth cue a
 * translate alone cannot give.
 *
 * EXIT IS A RELEASE, NOT THE ENTRANCE REVERSED. `--exit` accelerates away over
 * 130ms, taking 4px DOWN with the scale. That is a dismissal, and it is not the
 * 160ms float-back-down the earlier note rightly rejected. Both elements keep
 * ONE clock, 130ms each, because splitting them is #57 — the empty grey frame,
 * now found three times.
 */
.backdrop { position: fixed; inset: 0; z-index: 50; background: rgb(16 18 32 / .32);
  backdrop-filter: blur(1.5px); -webkit-backdrop-filter: blur(1.5px);
  transition:
    opacity calc(220ms * var(--slow)) linear,
    backdrop-filter calc(260ms * var(--slow)) var(--enter),
    -webkit-backdrop-filter calc(260ms * var(--slow)) var(--enter); }
.backdrop[data-starting-style], .backdrop[data-ending-style] { opacity: 0;
  backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); }
.backdrop[data-closed] { transition:
    opacity calc(130ms * var(--slow)) linear,
    backdrop-filter calc(130ms * var(--slow)) linear,
    -webkit-backdrop-filter calc(130ms * var(--slow)) linear; }

/* G2's wrapper: centring lives here so the popup's `translate` stays free. */
.centre { position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center; pointer-events: none; }

/*
 * THE MODAL'S MATERIAL, which had never been designed.
 *
 * Reported as "modals look too basic … very default and generic", and the
 * cause is sourced rather than guessed: **every modal in this phase —
 * `column-crud-v17`, `board-edit-v2` and this file — carried
 * `0 12px 32px rgb(16 18 32 / .16)` and no border at all.** That is the
 * pre-phase vocabulary. The Material section explicitly demoted it: *"hairline
 * border replaces shadow as the primary edge … shadow demoted to
 * `0 1px 2px rgba(16,18,32,.04)`"*, and the Direction section is *"restrained
 * precision — hairline borders rather than shadows"*.
 *
 * So the modal was the one surface still speaking the old language, which is
 * exactly what "generic" describes: a single soft blob under a borderless white
 * rectangle is the default every framework ships.
 *
 * Three things, all of them already specified and none of them applied here:
 *
 *   radius   **12px**, from the control-geometry table. Every modal in the
 *            phase used 6px. NOTE: that table marks this row *"proposed, never
 *            reviewed"* — so 12px is the written intent, not a settled fact.
 *   edge     a 1px hairline, the phase's primary edge device
 *   shadow   the demoted whisper, plus a lift
 *
 * The lift — `0 24px 48px -16px` — is MINE and is the one unbriefed value.
 * A card sits on a board and needs no lift; a modal sits over a scrim and a
 * whisper alone reads as a flat cut-out. The negative spread keeps it tight
 * under the box rather than a halo around it, which is what the old blob was.
 */
.popup { pointer-events: auto; position: relative;
  width: min(90vw, 28rem); max-height: calc(100vh - 6rem);
  background: #fff; border-radius: 12px; overflow: hidden;
  display: flex; flex-direction: column;
  border: 1px solid var(--line);
  box-shadow:
    0 1px 2px rgb(16 18 32 / .04),
    0 24px 48px -16px rgb(16 18 32 / .20);
  transition:
    opacity calc(90ms * var(--slow)) linear,
    translate calc(300ms * var(--slow)) var(--enter),
    scale calc(300ms * var(--slow)) var(--enter),
    box-shadow calc(300ms * var(--slow)) var(--enter); }
.popup[data-starting-style] { opacity: 0; translate: 0 18px; scale: .96;
  box-shadow:
    0 1px 2px rgb(16 18 32 / .04),
    0 4px 10px -6px rgb(16 18 32 / .10); }
/*
 * ONE DURATION ACROSS THE POPUP AND THE SCRIM on exit. Running the popup's
 * opacity at 90ms and the scrim's at 120ms left the last beat of every close as
 * an empty grey screen — measured on G2 at +161ms, popup 0 while the backdrop
 * was still 0.167. Two fades retiring one gesture share a clock (#40, #51, and
 * this, which is the third time).
 */
.popup[data-closed] { transition:
    opacity calc(130ms * var(--slow)) var(--exit),
    translate calc(130ms * var(--slow)) var(--exit),
    scale calc(130ms * var(--slow)) var(--exit); }
.popup[data-ending-style] { opacity: 0; translate: 0 4px; scale: .98; }

/*
 * THE BUTTON, FOURTH PASS — the jerk was the animated hard edge itself, so
 * nothing hard-edged animates on hover any more.
 *
 * v3 trimmed the hover to one property and one clock and it was STILL reported
 * as jerky. That is the signal that the amount was never the problem. What was
 * left animating was the plinth — a **solid, 0-blur bottom edge growing 2px →
 * 3px** — and a hard edge travelling through fractional positions is
 * antialiased into a soft band at every intermediate frame and then snaps crisp
 * at the end. A 1px shimmer that resolves with a click is exactly what "jerky"
 * describes, and no amount of further trimming reaches it, because the thing
 * being trimmed IS the artifact.
 *
 * So the plinth is now STATIC. It is 2px at rest and 2px on hover, and it moves
 * only on press, where the movement is the point.
 *
 * WHAT HOVER DOES INSTEAD: it changes the OPACITY of a sheen, and nothing else.
 * Opacity is the one property the compositor can animate without repainting or
 * re-rasterising anything, so a hover built on it cannot stutter — not "should
 * not", cannot. The sheen is a top-lit gradient on `::after`; raising it reads
 * as the light source coming closer to the face, which is what a hover has
 * always been trying to say and what darkening the fill said backwards.
 *
 * The overlay sits ABOVE the label, because an absolutely-positioned pseudo
 * always does. That is harmless here and deliberately so: each variant's sheen
 * is the same hue as its own text — white over white on the filled buttons,
 * ink over ink on the quiet one — so it is invisible exactly where it lands on
 * a glyph.
 *
 * WHAT SURVIVES from v2 and v3: hover may never change the top face's geometry,
 * because a hover that moves the box un-hovers itself — the pointer is left
 * behind, `:hover` stops matching, the box returns, and it oscillates. Press is
 * still the only state that moves, and it is safe because a press is held.
 *
 * On press the face goes down 2px WHILE the plinth goes to 0, so the two
 * cancel: the bottom edge of the whole control is stationary through the press
 * and only the top face travels. Nothing crawls there either.
 *
 * "Not a basic button" is carried by material rather than by motion — a flat
 * wash that lifts the whole face, a hairline inner ring, and a crisp 2px edge
 * below. Flat fill plus a colour swap is the basic button; this is the same
 * restraint with a light source. NOT a gradient: the first draft used one and
 * at 3x it was unmistakably a 2008 gloss, which is a different flavour of the
 * same complaint.
 */
.btn { appearance: none; border: none; font: inherit; font-weight: 700;
  position: relative; isolation: isolate;
  height: 40px; padding: 0 20px; border-radius: 4px; cursor: pointer; width: 100%;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--purple); color: #fff;
  box-shadow:
    inset 0 1px 0 rgb(255 255 255 / .14),
    inset 0 0 0 1px rgb(0 0 0 / .12),
    0 2px 0 var(--purple-edge);
  transition:
    background-color calc(120ms * var(--slow)) var(--e),
    opacity calc(120ms * var(--slow)),
    box-shadow calc(80ms * var(--slow)) var(--e),
    translate calc(80ms * var(--slow)) var(--e); }
/*
 * The sheen — a FLAT wash, not a gradient, and its opacity is the only thing
 * hover touches.
 *
 * The first version of this was a top-to-bottom white gradient, and at 3x it
 * was unmistakably a 2008 gloss button: bright cap, dark base, the exact
 * "basic" this pass exists to get away from. A gradient is a light SOURCE
 * being drawn; a flat wash is the surface being lit. The bevel that gives the
 * face its edge is already there as a static 1px inset highlight and does not
 * need help.
 *
 * .07 is not a taste value: white text on the washed fill has to stay at 4.5:1,
 * and .10 does not.
 */
.btn::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
  pointer-events: none; opacity: 0;
  background: rgb(255 255 255 / .07);
  transition: opacity calc(140ms * var(--slow)) var(--e); }
.btn:hover::after { opacity: 1; }
.btn:active { background: var(--purple-press); translate: 0 2px;
  box-shadow:
    inset 0 2px 3px rgb(0 0 0 / .24),
    inset 0 0 0 1px rgb(0 0 0 / .18),
    0 0 0 var(--purple-edge); }
.btn:active::after { opacity: 0; }
.btn:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

/* The quiet variant cannot be lit, so its sheen is an ink wash rather than a
   white one — the same mechanism, the same clock, the opposite direction. */
.btn.ghost { background: #fff; color: var(--ink);
  box-shadow:
    inset 0 2px 3px rgb(16 18 32 / 0),
    inset 0 0 0 1px var(--line),
    0 2px 0 var(--btn-quiet-edge); }
.btn.ghost::after { opacity: 0; background: rgb(16 18 32 / .045); }
.btn.ghost:hover::after { opacity: 1; }
/* The quiet press has to be darker than the quiet hover or the press reads as
   nothing happening — the two states were identical in the first draft. */
.btn.ghost:active::after { opacity: 1; background: rgb(16 18 32 / .10); }
.btn.ghost:active { background: #fff; translate: 0 2px;
  box-shadow:
    inset 0 2px 3px rgb(16 18 32 / .14),
    inset 0 0 0 1px var(--border-hover),
    0 0 0 var(--btn-quiet-edge); }


.btn.small { width: auto; height: 32px; padding: 0 16px; }
.btn.danger { background: var(--red);
  box-shadow:
    inset 0 1px 0 rgb(255 255 255 / .14),
    inset 0 0 0 1px rgb(0 0 0 / .12),
    0 2px 0 #862825; }
.btn.danger:active { background: #c03f3c; translate: 0 2px;
  box-shadow:
    inset 0 2px 3px rgb(0 0 0 / .24),
    inset 0 0 0 1px rgb(0 0 0 / .18),
    0 0 0 #862825; }
/*
 * DESTRUCTIVE IS THE ONE FILL THAT CANNOT BE LIT.
 *
 * White on `--red` (#EA5555) is **3.54:1** at rest — already under AA, and
 * inherited from the mock's own token rather than introduced here. A white wash
 * on top makes it worse, measured: 3.27:1 hovered. So danger inverts the
 * mechanism and washes with ink instead, which moves hover the other way
 * (3.96:1) rather than deepening a failure.
 *
 * The rule survives as "hover is the surface responding to the pointer"; only
 * the direction is fill-dependent. The rest state's 3.54:1 is NOT fixed here —
 * it needs `--red` itself to change, which is a token decision above this file.
 */
.btn.danger::after { background: rgb(16 18 32 / .06); }

@media (prefers-reduced-motion: reduce) {
  .popup { transition: opacity calc(100ms * var(--slow)) linear; }
  .popup[data-closed] { transition: opacity calc(90ms * var(--slow)) linear; }
  .popup[data-starting-style], .popup[data-ending-style] { opacity: 0; translate: none; scale: none; }
  .backdrop, .backdrop[data-closed] { transition: opacity calc(90ms * var(--slow)) linear; }
  .sroww.animating, .sroww.animating.entering, .cardw.entering {
    transition: height 1ms linear, margin-bottom 1ms linear, opacity calc(90ms * var(--slow)) linear; }
}
body.force-reduced .popup { transition: opacity calc(100ms * var(--slow)) linear; }
body.force-reduced .popup[data-closed] { transition: opacity calc(90ms * var(--slow)) linear; }
body.force-reduced .popup[data-starting-style],
body.force-reduced .popup[data-ending-style] { opacity: 0; translate: none; scale: none; }
body.force-reduced .backdrop,
body.force-reduced .backdrop[data-closed] { transition: opacity calc(90ms * var(--slow)) linear; }

/* Reduced motion: the scrim is a plain wash again — a blur that cannot
   transition would snap on, which is a cut, and cuts are what this policy
   exists to avoid. */
@media (prefers-reduced-motion: reduce) {
  .backdrop, .backdrop[data-starting-style], .backdrop[data-ending-style],
  .backdrop[data-closed] { backdrop-filter: none; -webkit-backdrop-filter: none; }
}
body.force-reduced .backdrop,
body.force-reduced .backdrop[data-starting-style],
body.force-reduced .backdrop[data-ending-style],
body.force-reduced .backdrop[data-closed] { backdrop-filter: none; -webkit-backdrop-filter: none; }
body.force-reduced .sroww.animating,
body.force-reduced .sroww.animating.entering,
body.force-reduced .cardw.entering {
  transition: height 1ms linear, margin-bottom 1ms linear, opacity calc(90ms * var(--slow)) linear; }

/* ------------------------------------------------------------------- rig */
.rig { font: 500 12px/1.8 ui-monospace, monospace; color: #4a5568; min-width: 250px; }
.rig h3 { font: 700 12px/1.4 "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; margin: 0 0 8px; }
.rig label { display: block; }

/*
 * REDUCE, DO NOT REMOVE, for the things this file adds.
 *
 * The toast keeps its fade and loses its rise.
 *
 * The collapse keeps both halves and drops the phase curve for a
 * linear one at 120ms — the space still closes, because a row vanishing and its
 * gap staying open is not a reduced variant, it is a broken one.
 */
@media (prefers-reduced-motion: reduce) {
  .toast { transition: opacity calc(100ms * var(--slow)) linear; }
  .toast.in, .toast.out { translate: none; }
  /*
   * `.animating.entering` is one class more specific than `.animating`, so a
   * reduced-motion override written at `.animating` LOSES to it and the entrance
   * kept its full 200ms curve. The rig's `body.force-reduced` masked this by
   * being more specific still — which is exactly how a reduced-motion bug hides
   * from the switch built to test it.
   */
  .cardrow.animating,
  .cardrow.animating.entering { transition:
      height calc(120ms * var(--slow)) linear,
      margin-bottom calc(120ms * var(--slow)) linear,
      opacity calc(90ms * var(--slow)) linear; }
}
body.force-reduced .toast { transition: opacity calc(100ms * var(--slow)) linear; }
body.force-reduced .toast.in, body.force-reduced .toast.out { translate: none; }
body.force-reduced .cardrow.animating,
body.force-reduced .cardrow.animating.entering { transition:
    height calc(120ms * var(--slow)) linear,
    margin-bottom calc(120ms * var(--slow)) linear,
    opacity calc(90ms * var(--slow)) linear; }

</style>
</head>
<body>
<div class="page">
  <div class="board" id="board"></div>
  <div class="rig">
    <h3>rig</h3>
    <label><input type="checkbox" id="slow"> slow motion (6&times;)</label>
    <label><input type="checkbox" id="reduced"> force reduced motion</label>
    <label>server: <select id="lat">
      <option value="ok">accepts</option>
      <option value="fail">refuses</option>
    </select></label>
    <label>latency: <select id="ms">
      <option value="120">120ms</option>
      <option value="1200">1200ms</option>
    </select></label>
    <p id="state">idle</p>
    <p style="font-size:11px;line-height:1.6">The card leaves on the press, not on
      the answer. Latency only changes how long a refusal takes to put it back —
      set it to 1200ms and delete two in a row to see the anchor hold.</p>
  </div>
</div>
<script>
const COLUMNS = [
  { name: "Todo", tasks: [
    { t: "Build UI for onboarding flow", s: "0 of 3 subtasks" },
    { t: "Build UI for search", s: "0 of 1 subtasks" },
    { t: "Build settings UI", s: "0 of 2 subtasks" },
    { t: "QA and test all major user journeys", s: "0 of 2 subtasks" },
  ]},
  { name: "Doing", tasks: [
    { t: "Design settings and search pages", s: "0 of 3 subtasks" },
    { t: "Add account management endpoints", s: "0 of 3 subtasks" },
  ]},
  { name: "Done", tasks: [
    { t: "Conduct 5 wireframe tests", s: "1 of 1 subtasks" },
  ]},
];

const SLOW = () => (document.getElementById("slow").checked ? 6 : 1);
/*
 * The threshold this file exists to test. Scaled by the slow-motion multiplier
 * like every other duration, or the rig would let you watch a 400ms wait that
 * the bar's own 160ms fade has already scaled past.
 */
/*
 * The first draft's patience threshold lived here — nothing loading-shaped for
 * 400ms, and once shown a 260ms floor so the deferral does not simply relocate
 * the flash. Both numbers were measured and both are right; neither applies to
 * a mutation the user never waits on. They are recorded in the defect log
 * (#75) for the next surface that genuinely blocks, and deleted from here,
 * because machinery left in a prototype is read as a recommendation.
 */
const say = (s) => { document.getElementById("state").textContent = s; };

function render() {
  const board = document.getElementById("board");
  board.textContent = "";
  COLUMNS.forEach((col, ci) => {
    const c = document.createElement("div");
    c.className = "col";
    const h = document.createElement("h2");
    h.className = "colhd";
    h.textContent = `${col.name} (${col.tasks.length})`;
    const list = document.createElement("div");
    list.className = "cards";
    list.dataset.col = String(ci);
    col.tasks.forEach((task, ti) => {
      const row = document.createElement("div");
      row.className = "cardrow";
      row.append(cardEl(task, ci, ti));
      list.append(row);
    });
    c.append(h, list);
    board.append(c);
  });
}

/* textContent throughout — #61: a template literal made a task title into markup. */
function cardEl(task, ci, ti) {
  const el = document.createElement("div");
  el.className = "card";
  el.dataset.col = String(ci);
  el.dataset.idx = String(ti);
  const t = document.createElement("h3");
  t.className = "ctitle";
  t.textContent = task.t;
  const s = document.createElement("p");
  s.className = "csub";
  s.textContent = task.s;
  const k = document.createElement("button");
  k.className = "kebab";
  k.type = "button";
  k.setAttribute("aria-label", `Delete ${task.t}`);
  k.textContent = "⋯";
  k.addEventListener("click", (e) => { e.stopPropagation(); openConfirm(el, task); });
  el.append(t, s, k);
  return el;
}

/* --------------------------------------------------------------- the modal */
/* G2's lifecycle verbatim: Base UI's own data attributes, driven by hand so the
   prototype cannot drift from what the library will actually do. */
let mounted = null;

/*
 * `mounted` is cleared at the START of the exit so the closing modal stops
 * taking input — but the DOM survives until the transition finishes, so a
 * second open in that window produced TWO popups and two backdrops. The guard
 * has to be the DOM, not the variable.
 */
function openConfirm(cardEl, task) {
  if (mounted || document.querySelector(".popup")) return;
  const backdrop = document.createElement("div");
  backdrop.className = "backdrop";
  backdrop.setAttribute("data-open", "");
  backdrop.setAttribute("data-starting-style", "");

  const centre = document.createElement("div");
  centre.className = "centre";
  const popup = document.createElement("div");
  popup.className = "popup";
  popup.setAttribute("role", "alertdialog");
  popup.setAttribute("aria-modal", "true");
  /* An alertdialog with no accessible name announces as "dialog" and nothing else. */
  popup.setAttribute("aria-labelledby", "delTitle");
  popup.setAttribute("data-open", "");
  popup.setAttribute("data-starting-style", "");

  const body = document.createElement("div");
  body.className = "pbody";

  const h = document.createElement("h2");
  h.className = "mtitle";
  h.id = "delTitle";
  h.textContent = "Delete this task?";


  const p = document.createElement("p");
  p.className = "mbody";
  p.append(
    document.createTextNode("Are you sure you want to delete the ‘"),
    Object.assign(document.createElement("strong"), { textContent: task.t }),
    document.createTextNode("’ task and its subtasks? This action cannot be reversed."),
  );

  const foot = document.createElement("div");
  foot.className = "mfoot";
  const del = document.createElement("button");
  del.className = "btn danger";
  del.type = "button";
  del.textContent = "Delete";
  const cancel = document.createElement("button");
  cancel.className = "btn ghost";
  cancel.type = "button";
  cancel.textContent = "Cancel";
  foot.append(del, cancel);

  body.append(h, p, foot);
  popup.append(body);
  centre.append(popup);
  document.body.append(backdrop, centre);
  mounted = { backdrop, centre, popup, del, cancel, cardEl };

  del.addEventListener("click", () => submit(task));
  cancel.addEventListener("click", () => closeModal());
  backdrop.addEventListener("click", () => closeModal());
  document.addEventListener("keydown", onKey);

  /*
   * TWO frames, not one. Releasing `data-starting-style` on the next rAF is not
   * reliably enough: the style has to have been recomputed once before the
   * released value can be transitioned FROM. One frame and the transition
   * silently never starts — the failure `getAnimations()` was brought in to
   * catch on the column drop.
   */
  requestAnimationFrame(() => requestAnimationFrame(() => {
    backdrop.removeAttribute("data-starting-style");
    popup.removeAttribute("data-starting-style");
    del.focus({ preventScroll: true });
  }));
  say("confirm open");
}

function onKey(e) {
  if (e.key === "Escape" && mounted) closeModal();
}

function closeModal(after) {
  if (!mounted) return;
  const { backdrop, centre, popup } = mounted;
  document.removeEventListener("keydown", onKey);
  mounted = null;

  backdrop.removeAttribute("data-open");
  popup.removeAttribute("data-open");
  backdrop.setAttribute("data-closed", "");
  popup.setAttribute("data-closed", "");
  void popup.offsetWidth;
  backdrop.setAttribute("data-ending-style", "");
  popup.setAttribute("data-ending-style", "");

  if (after) after();

  /*
   * #42 again: ask the animations, do not listen for an event. A listener
   * cannot tell a late `transitionend` from one that never fires because the
   * transition never started, and this popup transitions three properties at
   * three durations so which reports first is arbitrary.
   */
  const running = [...popup.getAnimations(), ...backdrop.getAnimations()];
  const land = () => { backdrop.remove(); centre.remove(); };
  if (running.length) Promise.allSettled(running.map((a) => a.finished)).then(land);
  else land();
  setTimeout(land, 200 * SLOW() + 250);
}

/* ------------------------------------------------------------- the request */
function server() {
  const refuses = document.getElementById("lat").value === "fail";
  const ms = +document.getElementById("ms").value;
  return new Promise((res, rej) =>
    setTimeout(() => (refuses ? rej(new Error("NOT_FOUND")) : res()), ms * SLOW()),
  );
}

/*
 * Authored per status, quoted from `use-delete-task.ts` rather than reinvented.
 * `NOT_FOUND` earns its own entry there for a stated reason: a double submit
 * lands on it, and generic retry copy would tell the user to retry something
 * that can never succeed again.
 */
const FAILURE_COPY = {
  NOT_FOUND: { title: "That task is no longer available.", description: "Refresh to see this board's current tasks." },
  UNAUTHENTICATED: { title: "Your session has expired.", description: "Sign in again to delete this task." },
  DEFAULT: { title: "Couldn't delete task.", description: "Try again." },
};

/*
 * OPTIMISTIC. The card leaves on the press, not on the answer — the modal's
 * exit and the collapse start on the same frame, and the request goes out
 * behind both. There is nothing to show while it is in flight, which is the
 * whole point: a spinner here would be inventing a wait the user does not have.
 */
function submit(task) {
  if (!mounted) return;
  const m = mounted;
  const row = m.cardEl.closest(".cardrow");
  const list = row.parentElement;
  /*
   * The anchor is the NEIGHBOUR, not an index. `use-delete-task` stores
   * `afterTaskId` for exactly this reason: between the press and the refusal
   * another card can be inserted or removed, and an index would put the task
   * back in someone else's place.
   */
  const anchor = row.previousElementSibling;
  /* `afterTaskId === null` and "the anchor has since gone" are DIFFERENT cases. */
  const wasFirst = anchor === null;
  const next = row.nextElementSibling ?? anchor;

  closeModal(() => collapse(m.cardEl));
  say("deleted — request in flight");

  /*
   * The modal is going, so focus is about to fall to `body` — which is where a
   * keyboard user loses the board. It moves to the neighbouring card's own
   * control, and if there is no neighbour (the column just emptied) it is left
   * alone rather than parked on the alert toast: a toast is an announcement,
   * not a destination, and putting focus in one steals it from wherever the
   * user goes next.
   */
  const target = next?.querySelector?.(".kebab");
  if (target) target.focus({ preventScroll: true });

  server().then(
    () => say("deleted"),
    (err) => {
      restore({ list, anchor, wasFirst, card: m.cardEl });
      const copy = FAILURE_COPY[err.message] ?? FAILURE_COPY.DEFAULT;
      toast(copy);
      say("refused — task restored where it was");
    },
  );
}

/* ---------------------------------------------------------- the restore */
/*
 * THE COLLAPSE REVERSED BY RULE, NOT REPLAYED BACKWARDS.
 *
 * Leaving, the contents go first and the box shuts after, so the tail of the
 * gesture is the space being reclaimed. Entering, that order inverts: the box
 * opens FIRST and the contents arrive at the end, because filling a box that is
 * already open is two beats and arriving with it is one. `subtask-crud-v2`
 * settled this asymmetry and it is the same one G2 uses on the modal — an enter
 * and a leave are different events, not one event played in two directions.
 *
 * The card element is REUSED rather than rebuilt: it still holds whatever the
 * user had done to it, and rebuilding is how a restore quietly loses state.
 */
function restore({ list, anchor, wasFirst, card }) {
  const row = document.createElement("div");
  row.className = "cardrow";
  row.append(card);
  card.style.opacity = "";
  /*
   * THREE CASES, NOT TWO, and the missing one is what `withTaskRestore` gets
   * right: `afterTaskId === null` means the task was first and belongs first,
   * while a non-null anchor that has SINCE BEEN DELETED means we no longer know
   * where it went — and the hook appends rather than guessing. Collapsing those
   * two onto "prepend" put a restored card at the top of the column it used to
   * be at the bottom of, and made two overlapping refusals come back reversed.
   */
  if (wasFirst) list.prepend(row);
  else if (anchor && anchor.parentElement === list) anchor.after(row);
  else list.append(row);

  const full = row.getBoundingClientRect().height;
  row.style.height = "0px";
  row.style.marginBottom = "0px";
  row.style.opacity = "0";
  void row.offsetWidth;
  row.classList.add("animating", "entering");

  let settled = false;
  const done = () => {
    if (settled) return;
    settled = true;
    row.classList.remove("animating", "entering");
    row.style.height = "";
    row.style.marginBottom = "";
    row.style.opacity = "";
    recount();
  };

  /*
   * Only if focus was actually lost. Stealing it back from wherever the user
   * moved on to is worse than the loss it is fixing.
   */
  if (document.activeElement === document.body) {
    card.querySelector(".kebab")?.focus({ preventScroll: true });
  }

  requestAnimationFrame(() => {
    row.style.height = `${full}px`;
    row.style.marginBottom = "20px";
    row.style.opacity = "1";
    const anims = row.getAnimations();
    if (anims.length) Promise.allSettled(anims.map((a) => a.finished)).then(done);
    else done();
  });
  setTimeout(done, 240 * SLOW() + 250);
  recount();
}

/* ------------------------------------------------------------- the toast */
function toast({ title, description }) {
  let host = document.querySelector(".toasts");
  if (!host) {
    host = document.createElement("div");
    host.className = "toasts";
    document.body.append(host);
  }
  const el = document.createElement("div");
  el.className = "toast in";
  el.setAttribute("role", "alert");
  const ico = document.createElement("span");
  ico.className = "ico";
  ico.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>';
  const body = document.createElement("div");
  const h = document.createElement("div");
  h.className = "ttitle";
  h.textContent = title;
  const d = document.createElement("div");
  d.className = "tdesc";
  d.textContent = description;
  body.append(h, d);
  el.append(ico, body);
  host.append(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove("in")));

  setTimeout(() => {
    el.classList.add("out");
    const anims = el.getAnimations();
    const go = () => {
      el.remove();
      if (!host.children.length) host.remove();
    };
    if (anims.length) Promise.allSettled(anims.map((a) => a.finished)).then(go);
    else go();
    setTimeout(go, 200 * SLOW() + 250);
  }, 5000 * SLOW());
}
/*
 * 5000ms, not a number of my own: `useFailureToast` passes no timeout, and
 * `use-toast.ts` records Base UI's default as 5000. A designed reference that
 * silently shortens the thing it is a reference FOR is worse than no reference.
 */

/* ---------------------------------------------------------- the collapse */
/*
 * BOTH ENDS THROUGH THE SAME CHANNEL. `height` cannot interpolate from `auto`,
 * so the start value has to be seeded inline — and an inline declaration beats
 * any class, so the END value must be set inline too. The first version of the
 * subtask row seeded inline and targeted a `.collapsed { height: 0 }` class;
 * the height never moved, no transition started, `getAnimations()` came back
 * empty, and the row vanished in one frame. The class here carries the
 * TRANSITION LIST and nothing else.
 *
 * The animations are read INSIDE the rAF, after the end values are set — read
 * synchronously they come back empty and the cleanup runs immediately, which is
 * #73. `done()` is guarded because the fallback timer and the promise both
 * call it.
 */
function collapse(card) {
  const row = card.closest(".cardrow");
  if (!row) return;
  const list = row.parentElement;

  /*
   * The header drops NOW, not when the collapse finishes. The hook writes the
   * cache in `onMutate`, so the count is already 3 while the card is still
   * shrinking; a header that waits for the animation is reporting the DOM
   * rather than the state, and lags it by the length of the motion.
   */
  row.dataset.going = "1";
  recount();

  row.style.height = `${row.getBoundingClientRect().height}px`;
  row.style.marginBottom = getComputedStyle(row).marginBottom;
  void row.offsetWidth;
  row.classList.add("animating");

  let settled = false;
  const done = () => {
    if (settled) return;
    settled = true;
    row.remove();
    recount();
  };

  requestAnimationFrame(() => {
    row.style.opacity = "0";
    row.style.height = "0px";
    row.style.marginBottom = "0px";
    const anims = row.getAnimations();
    if (anims.length) Promise.allSettled(anims.map((a) => a.finished)).then(done);
    else done();
  });
  /* Covers a backgrounded tab, where the rAF above never fires at all. */
  setTimeout(done, 240 * SLOW() + 250);
  void list;
}

function recount() {
  document.querySelectorAll(".col").forEach((c) => {
    const n = c.querySelectorAll(".cardrow:not([data-going]) .card").length;
    c.querySelector(".colhd").textContent = `${COLUMNS[[...document.querySelectorAll(".col")].indexOf(c)].name} (${n})`;
  });
}

document.getElementById("reduced").addEventListener("change", (e) => {
  document.body.classList.toggle("force-reduced", e.target.checked);
});
document.getElementById("slow").addEventListener("change", () => {
  document.documentElement.style.setProperty("--slow", String(SLOW()));
});
render();
</script>
</body>
</html>
