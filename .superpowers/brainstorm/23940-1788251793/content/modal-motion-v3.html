<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<title>Modal motion — v3</title>
<style>
/* ============================================================================
   G2 — MODAL ENTER AND EXIT.

   Why this file is not shaped like the other prototypes
   -----------------------------------------------------
   `board-edit-v2` and `column-crud-v17` both contain a modal, and both were
   recorded as "a first pass at G2". Neither can actually settle it, because
   both toggle an `.open` class on a permanently-mounted `<div>` — while the
   real component portals its popup and UNMOUNTS it. A CSS rule that reverses
   when a class is removed never runs when the element is deleted instead.

   So this file reproduces Base UI's own lifecycle, measured on the shipped
   `modal.tsx` in Storybook rather than read from documentation:

     open   mount with `data-open data-starting-style`   (both popup and backdrop)
            → one frame later, `data-starting-style` removed      (measured 13ms)
     close  `data-open` replaced by `data-closed data-ending-style`
            → element stays mounted until its transition finishes
            → then unmount                       (measured 18ms with no CSS,
                                                  172ms once a transition existed)

   That second measurement is the one that matters: **Base UI waits.** The exit
   is real, it is not a class reversal, and it is the half of G2 that has never
   been designed.

   The structural finding, which is about the shipping code
   -------------------------------------------------------
   `modal.tsx` centres its popup with `-translate-1/2`, i.e. `translate: -50%
   -50%`. `translate` is therefore ALREADY OCCUPIED, and dropping the
   prototypes' `translate: 0 8px` on top of it does not rise 8px — it replaces
   the centring. Measured: the modal flew **228px** diagonally, entering from
   (824,444) and landing at (600,400).

   Both existing prototypes are immune to this only by accident: they centre
   with grid `place-items: center`, where `translate` is free. So they would
   have handed over a value that is wrong in the only place it matters, and no
   amount of watching them would have shown it.

   Two ways out, both measured on the real component:

     `translate: -50% calc(-50% + 8px)`   8px ✓, but the motion value now
                                          encodes how centring is implemented —
                                          defect-log rule 9, one property with
                                          two owners, and it breaks in silence
                                          the day centring changes.
     a grid-centred WRAPPER               8px ✓, `translate` becomes a pure
                                          motion property, and the vocabulary
                                          below transfers verbatim.

   This file uses the wrapper, and that is an implementation requirement, not a
   prototype convenience: `Modal.Content` needs a `position: fixed; inset: 0;
   display: grid; place-items: center` div inside the portal, with the popup
   inside it and its own `top/left/-translate-1/2` removed.
   ============================================================================ */

:root {
  --e: cubic-bezier(.2,0,0,1);
  /* an arrival's long decelerating tail; a dismissal's acceleration away */
  --enter: cubic-bezier(.16,1,.3,1);
  --exit: cubic-bezier(.5,0,.9,.4);
  --slow: 1;
  --purple: #635FC7;
  --purple-hover: #5854be;
  --purple-press: #4f4bab;
  --purple-edge: #3f3c85;
  --btn-quiet-hover: color-mix(in srgb, var(--ink) 4%, #fff);
  --btn-quiet-press: color-mix(in srgb, var(--ink) 8%, #fff);
  --btn-quiet-edge: color-mix(in srgb, #000 14%, #fff);
  --border-hover: #d6dfef;
  --border-rest: #dce3f2;
  --press: 90ms;
  --red: #EA5555;
  --ink: #000112;
  --muted: #828FA3;
  --line: #E4EBFA;
  --tint: #F4F7FD;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--tint); color: var(--ink);
  font: 500 13px/1.5 "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }

/* page behind the modal, so "nothing else moved" is a thing that can be seen */
.page { padding: 28px; display: flex; gap: 28px; align-items: flex-start; }
.board { display: flex; gap: 16px; }
.col { width: 180px; }
.colh { font: 700 11px/1 "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.card { background: #fff; border-radius: 6px; padding: 12px; margin-bottom: 10px;
  box-shadow: 0 2px 4px rgba(54,78,126,.08); font: 700 12px/17px "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }

/* ---------------------------------------------------------------- the modal */
/*
 * `fixed`, not `absolute` — `column-crud-v17` records why: nested in a
 * `position: relative; overflow-x: auto` board, an absolute scrim resolved
 * `inset: 0` to the board's padding box, leaving the page header lit and the
 * dialog centred on a panel. A confirm is page-modal or it is not modal.
 */
.backdrop { position: fixed; inset: 0; z-index: 50; background: rgb(16 18 32 / 0.32); }

/*
 * THE WRAPPER. This is the part that has to reach `modal.tsx`.
 *
 * Centring here means the popup's own `translate` is untouched and available
 * for motion. `pointer-events: none` so the wrapper does not eat backdrop
 * clicks; the popup takes them back.
 */
.centre { position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center; pointer-events: none; }

/*
 * THE POPUP IS A THREE-PART COLUMN, not one scroll region.
 *
 * `modal.tsx` today wraps EVERYTHING in a single `overflow-y-auto` div, so on a
 * long form the title goes off the top and the submit button goes off the
 * bottom. Confirmed on the shipped component, not inferred: in the
 * `LongContent` story the title is inside the scroller and is fully out of view
 * once it is scrolled, while the close button survives — because it, and only
 * it, was deliberately made a SIBLING of the scroll region.
 *
 * That is the right rule applied to one control out of three. The same split
 * the task panel arrived at applies here: what identifies the surface and what
 * acts on it are pinned, and only the collection between them scrolls. A form
 * whose submit button has scrolled out of reach is the clearest case of it —
 * you cannot see the thing you are trying to press.
 *
 * `min-height: 0` on the scroller is the load-bearing half: a flex child's
 * default `min-height: auto` refuses to shrink below its content, so without it
 * the middle section pushes the footer off the popup instead of scrolling.
 */
/*
 * THE MODAL'S MATERIAL, which had never been designed.
 *
 * Reported as "modals look too basic … very default and generic", and the
 * cause is sourced rather than guessed: **every modal in this phase —
 * `column-crud-v17`, `board-edit-v2` and this file — carried
 * `0 12px 32px rgb(16 18 32 / .16)` and no border at all.** That is the
 * pre-phase vocabulary. The Material section explicitly demoted it: *"hairline
 * border replaces shadow as the primary edge … shadow demoted to
 * `0 1px 2px rgba(16,18,32,.04)`"*, and the Direction section is *"restrained
 * precision — hairline borders rather than shadows"*.
 *
 * So the modal was the one surface still speaking the old language, which is
 * exactly what "generic" describes: a single soft blob under a borderless white
 * rectangle is the default every framework ships.
 *
 * Three things, all of them already specified and none of them applied here:
 *
 *   radius   **12px**, from the control-geometry table. Every modal in the
 *            phase used 6px. NOTE: that table marks this row *"proposed, never
 *            reviewed"* — so 12px is the written intent, not a settled fact.
 *   edge     a 1px hairline, the phase's primary edge device
 *   shadow   the demoted whisper, plus a lift
 *
 * The lift — `0 24px 48px -16px` — is MINE and is the one unbriefed value.
 * A card sits on a board and needs no lift; a modal sits over a scrim and a
 * whisper alone reads as a flat cut-out. The negative spread keeps it tight
 * under the box rather than a halo around it, which is what the old blob was.
 */
.popup { pointer-events: auto;
  width: min(90vw, 28rem); max-height: calc(100vh - 6rem);
  background: #fff; border-radius: 12px; overflow: hidden;
  display: flex; flex-direction: column;
  border: 1px solid var(--line);
  box-shadow:
    0 1px 2px rgb(16 18 32 / .04),
    0 24px 48px -16px rgb(16 18 32 / .20); }
/* the simple case — content that cannot overflow keeps one padded box */
.pbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 24px; }
/* the three-part case */
.mhead { flex: none; padding: 24px 24px 0; }
.mscroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 24px; }
.mfootbar { flex: none; padding: 16px 24px 24px; background: #fff;
  border-top: 1px solid var(--line); }
/*
 * THE ADOPTED BUTTON — `buttons-v4.html`, decided 2026-09-09, not
 * `button-variants.ts`.
 *
 * A STRAY `.mfootbar` SAT WHERE THIS COMMENT NOW OPENS, from G2 onward. CSS
 * skips a comment, so the rule below read `.mfootbar .btn` and every button
 * outside the long-form footer — including the confirm dialog's — silently fell
 * back to unstyled: 20px radius, no plinth, and `--lift` unset, which makes
 * `translate: 0 var(--lift)` INVALID, so a keyboard press never sank at all.
 * This shipped inside a surface that was signed off. Found by Codex.
 *
 * This file first copied the SHIPPED tokens: `rounded-full`, `h-10`, and
 * `bg-bg-primary-hover` (#A8A4FF, a LIGHTER hover). All three are exactly what
 * the phase decided to replace — "the pill is the single loudest 2021 tell" —
 * so matching shipping code reproduced the look the work exists to remove.
 *
 * The prototypes are ahead of `src/`. Read the DECISION, not the code it has
 * not reached yet.
 *
 *   radius   4px, replacing `rounded-full`
 *   rest     inset top highlight, 1px inner hairline, solid 2px bottom edge
 *   hover    one step DARKER (#5854be), not lighter
 *   press    darker again, `translate: 0 2px`, bottom edge to 0, highlight
 *            inverts to an inner shadow — the whole point of the redesign was
 *            that nothing in the app acknowledged being pressed
 *   pending  holds the pressed geometry, `opacity: .75`
 *
 * `.ghost` is the `quiet` treatment from `column-crud-v3`, whose hover does its
 * work through the BORDER: white → #FAFBFE is a 5/4/1 channel step, under the
 * filmstrip's own noise floor of 8, so the fill-only hover could not be seen.
 * It DELIBERATELY diverges from mock p38's lavender fill — the amendment of
 * 2026-09-09 made that call after the user reported the lavender reading as a
 * bright pill on a dark canvas.
 */
/*
 * THE BUTTON, THIRD PASS — the same idea with two thirds of it deleted.
 *
 * v2 got the RULE right and the amount wrong. Reported as "doing too much",
 * "jerky and unsmooth", and "shadow is a bit too much" — three descriptions of
 * one over-built hover, and the jerk had a mechanical cause rather than a
 * matter-of-taste one:
 *
 *   - The ambient was a 16px-BLUR shadow being animated. A blurred box-shadow
 *     is not compositable: every frame is a fresh rasterisation of the blur,
 *     which is about the most expensive thing you can put on a hover. It was
 *     also, straightforwardly, the "too much shadow".
 *   - The release curve overshot by ~10%. On a 4px travel that is 0.4px of
 *     backtrack — too small to read as a spring, exactly the right size to
 *     read as a stutter.
 *   - Three properties changed at once on hover (plinth, highlight, ambient)
 *     on THREE clocks (140ms, 180ms, 200ms), so the hover had no single moment
 *     of arrival.
 *
 * What survives is the part that was right: **hover may never change the top
 * face's geometry**, because a hover that moves the box un-hovers itself — the
 * pointer is left behind, `:hover` stops matching, the box returns, and it
 * oscillates. So hover still happens entirely UNDER the face: the solid bottom
 * edge (the plinth) grows 2px → 3px and the inner top highlight brightens .16
 * → .24. Two properties, one 120ms clock, no blur anywhere.
 *
 * PRESS is the only state allowed to move, and it is safe because a press is
 * held: `:active` survives wherever the cursor goes. It sinks by exactly the
 * plinth's current height — `translate: 0 var(--lift)` — with the plinth to 0,
 * so the face lands flush ON the page rather than above a stub. Fill darkens
 * here and only here; the highlight inverts to a shallow inset. 80ms, plain
 * decel, no overshoot.
 *
 * `--lift` couples the three states without repeating a number: hover writes
 * 3px, `:active` reads whichever rule won, so a press from hover bottoms out
 * from 3px and a keyboard or touch press bottoms out from 2px. Both land flush.
 *
 * Every shadow list is THREE shadows in every state. `box-shadow` interpolates
 * only between lists of equal length; a state that drops one cuts instead of
 * transitioning.
 */
.btn { appearance: none; border: none; font: inherit; font-weight: 700;
  --lift: 2px;
  height: 40px; padding: 0 20px; border-radius: 4px; cursor: pointer; width: 100%;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--purple); color: #fff;
  box-shadow:
    inset 0 1px 0 rgb(255 255 255 / .16),
    inset 0 0 0 1px rgb(0 0 0 / .12),
    0 var(--lift) 0 var(--purple-edge);
  transition:
    background-color calc(120ms * var(--slow)) var(--e),
    opacity calc(120ms * var(--slow)),
    box-shadow calc(120ms * var(--slow)) var(--e),
    translate calc(120ms * var(--slow)) var(--e); }
.btn:hover { --lift: 3px;
  box-shadow:
    inset 0 1px 0 rgb(255 255 255 / .24),
    inset 0 0 0 1px rgb(0 0 0 / .12),
    0 var(--lift) 0 var(--purple-edge); }
.btn:active { background: var(--purple-press); translate: 0 var(--lift);
  box-shadow:
    inset 0 2px 3px rgb(0 0 0 / .24),
    inset 0 0 0 1px rgb(0 0 0 / .18),
    0 0 0 var(--purple-edge);
  transition-duration: calc(80ms * var(--slow)); }
.btn:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

/* The quiet fill cannot lighten, so its hover is carried by the ring and the
   plinth — the same two-property treatment, not an exception to it. */
.btn.ghost { background: #fff; color: var(--ink);
  box-shadow:
    inset 0 2px 3px rgb(16 18 32 / 0),
    inset 0 0 0 1px var(--line),
    0 var(--lift) 0 var(--btn-quiet-edge); }
.btn.ghost:hover { --lift: 3px;
  box-shadow:
    inset 0 2px 3px rgb(16 18 32 / 0),
    inset 0 0 0 1px var(--border-hover),
    0 var(--lift) 0 var(--btn-quiet-edge); }
.btn.ghost:active { background: var(--btn-quiet-press); translate: 0 var(--lift);
  box-shadow:
    inset 0 2px 3px rgb(16 18 32 / .14),
    inset 0 0 0 1px var(--border-hover),
    0 0 0 var(--btn-quiet-edge); }

.btn.small { width: auto; height: 32px; padding: 0 16px; }
/* Destructive takes the same geometry with its own edge — one treatment, three fills. */
.btn.danger { background: var(--red);
  box-shadow:
    inset 0 1px 0 rgb(255 255 255 / .16),
    inset 0 0 0 1px rgb(0 0 0 / .12),
    0 var(--lift) 0 #862825; }
.btn.danger:hover { --lift: 3px;
  box-shadow:
    inset 0 1px 0 rgb(255 255 255 / .24),
    inset 0 0 0 1px rgb(0 0 0 / .12),
    0 var(--lift) 0 #862825; }
.btn.danger:active { background: #c03f3c; translate: 0 var(--lift);
  box-shadow:
    inset 0 2px 3px rgb(0 0 0 / .24),
    inset 0 0 0 1px rgb(0 0 0 / .18),
    0 0 0 #862825; }

/* ------------------------------------------------------------- the motion */
/*
 * ENTER AND EXIT ARE NOT THE SAME GESTURE REVERSED, and the existing
 * prototypes only ever had the reversal because removing a class is all they
 * could do.
 *
 * Entering, the modal earns the attention it is taking: it rises 8px and
 * settles from 0.985, on the phase curve, 160ms — the arrival is the point.
 * Leaving, it should get out of the way rather than perform: the position
 * animation is dropped entirely (a modal sliding back down reads as falling,
 * and it is travelling toward content the user is trying to see again), and
 * what remains is a faster fade with the same small scale.
 *
 * The durations are the phase's existing modal vocabulary, which both prior
 * prototypes already measured and agreed on: scrim 160ms linear, popup opacity
 * 120ms linear, popup position 160ms on the curve. Only the exit is new.
 */
/*
 * THE MOTION, RE-DERIVED — reported as "kinda basic", and it was: opacity +
 * 8px + scale .985, one 160ms budget, symmetric both ways. That is the default
 * recipe, and three specific things made it read as one.
 *
 *   1. OPACITY AND TRAVEL SHARED A CLOCK. A box that finishes fading exactly
 *      when it finishes moving is translucent for the whole of its travel, so
 *      the eye reads a fade and never an arriving object. Opacity now finishes
 *      at 90ms while translate and scale run to 300ms, and the split was tuned
 *      against the curve rather than picked: `--enter` front-loads so hard that
 *      a 150ms fade left **0.15px** of travel outstanding — measured, by
 *      scrubbing the running transition rather than sampling a wall clock.
 *      That is the same fade-and-arrive-together defect with larger numbers on
 *      it. At 90ms over 18px the popup is fully opaque with **2.2px** still to
 *      go, and those 2.2px take the remaining 210ms — a solid panel settling,
 *      which is the whole difference from a ghost drifting.
 *   2. THE CURVE HAD NO TAIL. `--e` is the phase's general-purpose curve. An
 *      arrival wants `--enter`, an expo-out: nearly all the distance covered
 *      at once, then a long decelerating settle. Same budget, different
 *      character.
 *   3. THE SCRIM WAS A FLAT WASH. It now blurs 0 → 1.5px as well, so the board
 *      behind actually recedes — depth from defocus rather than from a grey
 *      sheet laid over everything.
 *
 * The popup's SHADOW animates with it, starting tight and flat and ending on
 * the full lift, so it reads as rising toward the viewer — the one depth cue a
 * translate alone cannot give.
 *
 * EXIT IS A RELEASE, NOT THE ENTRANCE REVERSED. `--exit` accelerates away over
 * 130ms, taking 4px DOWN with the scale. That is a dismissal, and it is not the
 * 160ms float-back-down the earlier note rightly rejected. Both elements keep
 * ONE clock, 130ms each, because splitting them is #57 — the empty grey frame,
 * now found three times.
 */
.backdrop { backdrop-filter: blur(1.5px); -webkit-backdrop-filter: blur(1.5px);
  transition:
    opacity calc(220ms * var(--slow)) linear,
    backdrop-filter calc(260ms * var(--slow)) var(--enter),
    -webkit-backdrop-filter calc(260ms * var(--slow)) var(--enter); }
.backdrop[data-starting-style],
.backdrop[data-ending-style] { opacity: 0;
  backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); }

.popup {
  transition:
    opacity calc(90ms * var(--slow)) linear,
    translate calc(300ms * var(--slow)) var(--enter),
    scale calc(300ms * var(--slow)) var(--enter),
    box-shadow calc(300ms * var(--slow)) var(--enter);
}
.popup[data-starting-style] { opacity: 0; translate: 0 18px; scale: .96;
  box-shadow:
    0 1px 2px rgb(16 18 32 / .04),
    0 4px 10px -6px rgb(16 18 32 / .10); }

/*
 * Exit: shorter than the enter, no position, and ONE DURATION ACROSS BOTH
 * ELEMENTS.
 *
 * The first version ran the popup's opacity at 90ms and the scrim's at 120ms,
 * on the reasoning that the popup should clear first. Measured, that is rubric
 * check 9's failure exactly: at +161ms the popup was at 0 while the backdrop
 * was still 0.167, so the last beat of every close was an empty grey screen
 * with nothing on it. Two fades retiring one gesture have to share a clock —
 * the same finding as #40 and #51, arriving for the third time.
 */
.popup[data-closed] {
  transition:
    opacity calc(130ms * var(--slow)) var(--exit),
    translate calc(130ms * var(--slow)) var(--exit),
    scale calc(130ms * var(--slow)) var(--exit);
}
.popup[data-ending-style] { opacity: 0; translate: 0 4px; scale: .98; }
.backdrop[data-closed] { transition:
    opacity calc(130ms * var(--slow)) linear,
    backdrop-filter calc(130ms * var(--slow)) linear,
    -webkit-backdrop-filter calc(130ms * var(--slow)) linear; }

/*
 * REDUCE, DO NOT REMOVE — the phase's stated policy, and G1's whole complaint
 * is that no prototype has ever designed the reduced variant rather than
 * deleting the animation.
 *
 * What survives is the opacity, because it is the part that says "this is a new
 * surface, it was not here a moment ago" without moving anything. What goes is
 * every spatial property: translate and scale. The durations shorten but do not
 * reach zero — an instant appearance is a cut, and a cut is the thing the phase
 * decided against for its own reasons.
 *
 * Load-bearing detail: this must NOT become `transition: none`. Base UI holds
 * the element mounted until the transition finishes, so removing it entirely
 * takes the exit down to the 18ms unmount and the modal vanishes mid-scrim.
 */
@media (prefers-reduced-motion: reduce) {
  .popup {
    transition: opacity calc(100ms * var(--slow)) linear;
  }
  .popup[data-closed] { transition: opacity calc(90ms * var(--slow)) linear; }
  .popup[data-starting-style],
  .popup[data-ending-style] { opacity: 0; translate: none; scale: none; }
  .backdrop { transition: opacity calc(100ms * var(--slow)) linear; }
  .backdrop[data-closed] { transition: opacity calc(90ms * var(--slow)) linear; }
}
/* The rig's checkbox forces the same rules without touching OS settings. */
body.force-reduced .popup { transition: opacity calc(100ms * var(--slow)) linear; }
body.force-reduced .popup[data-closed] { transition: opacity calc(90ms * var(--slow)) linear; }
body.force-reduced .popup[data-starting-style],
body.force-reduced .popup[data-ending-style] { opacity: 0; translate: none; scale: none; }
body.force-reduced .backdrop { transition: opacity calc(100ms * var(--slow)) linear; }
body.force-reduced .backdrop[data-closed] { transition: opacity calc(90ms * var(--slow)) linear; }

/* Reduced motion: the scrim is a plain wash again — a blur that cannot
   transition would snap on, which is a cut, and cuts are what this policy
   exists to avoid. */
@media (prefers-reduced-motion: reduce) {
  .backdrop, .backdrop[data-starting-style], .backdrop[data-ending-style],
  .backdrop[data-closed] { backdrop-filter: none; -webkit-backdrop-filter: none; }
}
body.force-reduced .backdrop,
body.force-reduced .backdrop[data-starting-style],
body.force-reduced .backdrop[data-ending-style],
body.force-reduced .backdrop[data-closed] { backdrop-filter: none; -webkit-backdrop-filter: none; }

/* ------------------------------------------------------------- the content */
.mtitle { font: 700 18px/23px "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; margin: 0 0 10px; }
.mtitle.danger { color: var(--red); }
.mdesc { color: var(--muted); font: 500 13px/23px "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; margin: 0 0 18px; }
.field { display: block; margin-bottom: 14px; }
.field span { display: block; font: 700 12px/15px "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
  color: var(--muted); margin-bottom: 8px; }
.field input { width: 100%; border: 1px solid var(--line); border-radius: 4px;
  padding: 9px 11px; font: 500 13px/1 "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }
/*
 * Right-aligned for a FORM, two equal columns for a CONFIRM — mock p42 puts
 * Delete and Cancel side by side filling the width, and p39 puts a single
 * full-width Save Changes. A destructive choice is a fork, not a primary action
 * with an escape hatch, and equal buttons are what say so.
 */
.mfoot { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 6px; }
.mfoot.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.mfoot.split .btn { width: 100%; }
.mfoot.wide .btn { width: 100%; }
/*
 * A SECOND `.btn` BLOCK USED TO SIT HERE, carrying the pre-phase pill — 20px
 * radius, a `color-mix` lavender ghost, no plinth — and being LATER in the
 * sheet it won every property it declared. Two stale rules in one file, both
 * beating the adopted treatment by source order: the same failure as #62's
 * probe, which passed while a stale `--purple-hover` further down still won.
 * Deleted rather than patched; a duplicate rule is not a fallback.
 */
.mclose { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px;
  border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 4px; }
.popup { position: relative; }

/* ------------------------------------------------------------------- rig */
.rig { font: 500 12px/1.8 ui-monospace, monospace; color: #4a5568; min-width: 260px; }
.rig h3 { font: 700 12px/1.4 "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; margin: 0 0 8px; }
.rig label { display: block; }
.rig button { font: 600 12px/1 "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; color: var(--purple);
  background: none; border: 0; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
.rig button:hover { background: #fff; }
</style>
</head>
<body>
<div class="page">
  <div class="board">
    <div class="col"><div class="colh">Todo (2)</div>
      <div class="card">Build UI for onboarding flow</div>
      <div class="card">Build UI for search</div></div>
    <div class="col"><div class="colh">Doing (2)</div>
      <div class="card">Design settings and search pages</div>
      <div class="card">Add account management endpoints</div></div>
  </div>

  <div class="rig">
    <h3>Rig</h3>
    <label><input type="checkbox" id="slow"> slow motion (6&times;)</label>
    <label><input type="checkbox" id="reduced"> force reduced motion</label>
    <label><button id="openConfirm">open — delete confirm</button></label>
    <label><button id="openForm">open — create board</button></label>
    <label>rows: <input type="number" id="rows" value="30" min="1" max="200" style="width:64px"></label>
    <label><button id="openLong">open — long form</button></label>
    <p id="state">closed</p>
  </div>
</div>

<script>
const SLOW = () => Number(getComputedStyle(document.documentElement).getPropertyValue("--slow")) || 1;
document.getElementById("slow").onchange = (e) =>
    document.documentElement.style.setProperty("--slow", e.target.checked ? 6 : 1);
document.getElementById("reduced").onchange = (e) =>
    document.body.classList.toggle("force-reduced", e.target.checked);

const state = document.getElementById("state");
/*
 * The row count is a rig INPUT, not a constant. Twelve rows fit a 920px window,
 * so the fixed-12 version showed a modal that simply did not scroll — the state
 * being designed was unreachable on the machine looking at it. Any check that
 * depends on overflow has to be able to produce overflow at the viewport it is
 * actually being run at (rubric check 13's scale pass, one surface early).
 */
const rowCount = () => Math.max(1, Number(document.getElementById("rows").value) || 30);

const CONTENT = {
  confirm: `
    <h2 class="mtitle danger">Delete this board?</h2>
    <p class="mdesc">Are you sure you want to delete the &lsquo;Platform Launch&rsquo; board?
      This action will remove all columns and tasks and cannot be reversed.</p>
    <div class="mfoot split"><button class="btn danger" data-close>Delete</button>
      <button class="btn ghost" data-close>Cancel</button></div>`,
  form: `
    <h2 class="mtitle">Add New Board</h2>
    <label class="field"><span>Board Name</span><input value="Platform Launch"></label>
    <label class="field"><span>Board Columns</span><input value="Todo"></label>
    <div class="mfoot wide"><button class="btn" data-close>Create New Board</button></div>`,
};

/*
 * The long form is built as head / scroll / foot rather than as one body, and
 * that is the shape `Modal.Content` has to be able to express — a modal is not
 * always a paragraph, and the one case where it is a list is the one where its
 * own controls stop being reachable.
 */
const longForm = (rows) => `
  <div class="mhead">
    <h2 class="mtitle">Add New Board</h2>
    <label class="field"><span>Board Name</span><input value="Platform Launch"></label>
    <span class="sublab">Board Columns</span>
  </div>
  <div class="mscroll">
    ${Array.from({ length: rows }, (_, n) =>
      `<label class="field"><input value="Column ${n + 1}"></label>`).join("")}
  </div>
  <div class="mfootbar"><button class="btn" data-close>Create New Board</button></div>`;

let mounted = null;

/*
 * MOUNT, SEED, RELEASE — Base UI's own sequence, reproduced rather than
 * approximated, because the whole point of this file is that the class-toggle
 * version cannot show what the real one does.
 *
 * `data-starting-style` comes off on the SECOND frame. One rAF is not reliably
 * enough: the first callback can run before the browser has committed the
 * mounted element's style, and the transition then starts from the released
 * value and never runs at all — the same "did the transition actually start"
 * trap as #42, arriving through mount timing instead of through a listener.
 */
function openModal(kind) {
  if (mounted) closeModal(true);
  const backdrop = document.createElement("div");
  backdrop.className = "backdrop";
  backdrop.setAttribute("data-open", "");
  backdrop.setAttribute("data-starting-style", "");

  const centre = document.createElement("div");
  centre.className = "centre";
  const popup = document.createElement("div");
  popup.className = "popup";
  popup.setAttribute("role", "dialog");
  popup.setAttribute("aria-modal", "true");
  popup.setAttribute("data-open", "");
  popup.setAttribute("data-starting-style", "");
  popup.innerHTML = (kind === "long" ? longForm(rowCount()) : `<div class="pbody">${CONTENT[kind]}</div>`) +
    `<button class="mclose" data-close aria-label="Close">&#10005;</button>`;
  centre.appendChild(popup);

  document.body.append(backdrop, centre);
  mounted = { backdrop, centre, popup };
  state.textContent = `open — ${kind}`;

  requestAnimationFrame(() => requestAnimationFrame(() => {
    backdrop.removeAttribute("data-starting-style");
    popup.removeAttribute("data-starting-style");
  }));

  backdrop.addEventListener("click", () => closeModal());
  popup.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => closeModal()));
  popup.querySelector("input, button")?.focus();
}

/*
 * The exit waits for the ANIMATION, not for a timer and not for a listener.
 *
 * #42: `.popup[data-closed]` transitions two properties at different durations,
 * so which reports `transitionend` first is arbitrary, and a listener cannot
 * tell a late event from one that never fires because the transition never
 * started. `getAnimations()` after a forced flush answers both — and the
 * `else` branch is not a fallback, it is the reduced-motion and
 * no-transition case, where unmounting at once is correct.
 */
function closeModal(immediate) {
  if (!mounted) return;
  const { backdrop, centre, popup } = mounted;
  mounted = null;
  const drop = () => { backdrop.remove(); centre.remove(); state.textContent = "closed"; };
  if (immediate) return drop();

  backdrop.removeAttribute("data-open");
  popup.removeAttribute("data-open");
  backdrop.setAttribute("data-closed", "");
  popup.setAttribute("data-closed", "");
  void popup.offsetWidth;
  backdrop.setAttribute("data-ending-style", "");
  popup.setAttribute("data-ending-style", "");
  void popup.offsetWidth;

  /* Base UI holds the element until the LONGEST of them finishes. */
  const running = [...popup.getAnimations(), ...backdrop.getAnimations()];
  state.textContent = `closing — ${running.length} animation(s)`;
  if (!running.length) return drop();
  Promise.allSettled(running.map((a) => a.finished)).then(drop);
}

document.getElementById("openConfirm").onclick = () => openModal("confirm");
document.getElementById("openForm").onclick = () => openModal("form");
document.getElementById("openLong").onclick = () => openModal("long");
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
</script>
</body>
</html>
