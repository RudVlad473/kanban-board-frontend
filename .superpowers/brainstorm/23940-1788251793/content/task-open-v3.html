<h2>4e &middot; Opening a task &mdash; v3, closing the panel and animating C
  <span style="font:500 11px ui-monospace,monospace;color:#7a8296">Esc, an explicit close, and click-the-card-again &middot; a second card swaps rather than closes &middot; C now animates its expansion</span>
</h2>

<div class="tp-bar">
  <button class="mock-button tp-opt" data-opt="modal">A &mdash; modal</button>
  <button class="mock-button tp-opt is-on" data-opt="panel">B &mdash; panel</button>
  <button class="mock-button tp-opt" data-opt="inline">C &mdash; in place</button>
  <span class="tp-sp"></span>
  <button class="mock-button" id="tpSlow">Slow motion: off</button>
  <button class="mock-button" id="tpClose">Close</button>
</div>
<p class="tp-note" id="tpNote"></p>

<div class="tp-stage" id="tpStage">
  <div class="tp-scroll" id="tpScroll">
    <div class="tp-board" id="tpBoard"></div>
  </div>
  <div class="tp-scrim" id="tpScrim"></div>
  <div class="tp-modal" id="tpModal"></div>
  <aside class="tp-panel" id="tpPanel"><div class="tp-inner" id="tpInner"></div></aside>
</div>

<style>
.tp-bar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:10px 0 8px; }
.tp-opt.is-on { background:#635FC7; color:#fff; border-color:#635FC7; }
.tp-sp { flex:1; }
.tp-note { font:500 12px/1.6 ui-sans-serif,system-ui,sans-serif; color:#5b6274;
  margin:0 0 12px; min-height:32px; max-width:98ch; }
.tp-note b { color:#000112; }
.tp-note code { font:11px ui-monospace,Menlo,monospace; background:#EDF0F8; padding:1px 5px; border-radius:3px; }

.tp-stage { --d:.22s; --e:cubic-bezier(.2,0,0,1);
  position:relative; display:flex; height:430px; background:#F4F7FD;
  border:1px solid #E4EBFA; border-radius:8px; overflow:hidden; }
.tp-stage.slow { --d:1.1s; }

/* the board scrolls; it is never clipped by the panel */
.tp-scroll { flex:1; min-width:0; overflow-x:auto; overflow-y:hidden; scroll-behavior:smooth; }
.tp-board { display:flex; gap:24px; padding:18px; height:100%; box-sizing:border-box; width:max-content; }
.tp-col { width:280px; flex:none; }
.tp-colh { display:flex; align-items:center; gap:8px; margin-bottom:12px;
  font:700 12px/15px ui-sans-serif,system-ui,sans-serif; letter-spacing:2.4px;
  text-transform:uppercase; color:#828FA3; }
.tp-colh i { width:11px; height:11px; border-radius:50%; flex:none; }
.tp-colh span { letter-spacing:0; }

.tp-card { background:#fff; border:1px solid #E4EBFA; border-radius:8px; padding:14px;
  margin-bottom:10px; cursor:pointer; transition:border-color .13s, background .13s; }
.tp-card:hover { border-color:#D6DFEF; background:#FAFBFE; }
.tp-card.is-open { border-color:#B9B4F0; background:#FAFBFE; }
.tp-card b { display:block; font:700 15px/19px ui-sans-serif,system-ui,sans-serif; color:#000112; }
.tp-p { display:flex; align-items:center; gap:9px; margin-top:7px; }
.tp-p s { flex:1; height:3px; border-radius:2px; background:#E4EBFA; text-decoration:none; overflow:hidden; }
.tp-p u { display:block; height:100%; background:#635FC7; border-radius:2px;
  transition:width .2s var(--e); }
.tp-p span { font:700 12px/15px ui-sans-serif,system-ui,sans-serif; color:#828FA3;
  font-variant-numeric:tabular-nums; }

/* ---- B: panel. width animates (layout), never transform — rule 4's mechanical form.
        A fixed-width inner inside overflow:hidden keeps the contents from reflowing. ---- */
.tp-panel { flex:none; width:0; overflow:hidden; background:#fff;
  border-left:1px solid transparent; transition:width var(--d) var(--e), border-color var(--d); }
.tp-stage.is-panel .tp-panel { width:400px; border-left-color:#E4EBFA; }
.tp-inner { width:400px; height:100%; box-sizing:border-box; padding:22px; overflow-y:auto; }

/* ---- A: modal ---- */
.tp-scrim { position:absolute; inset:0; background:rgba(0,1,18,.5); opacity:0;
  pointer-events:none; transition:opacity var(--d); z-index:8; }
.tp-stage.is-modal .tp-scrim { opacity:1; pointer-events:auto; }
.tp-modal { position:absolute; top:50%; left:50%; width:448px; margin-left:-224px;
  background:#fff; border-radius:8px; padding:24px; z-index:9; display:none;
  box-shadow:0 10px 30px rgba(16,18,32,.2); max-height:82%; overflow-y:auto; }
.tp-stage.is-modal .tp-modal { display:block; }

/* ---- detail body, shared ---- */
.tp-t { font:700 18px/23px ui-sans-serif,system-ui,sans-serif; color:#000112;
  margin:0 0 10px; padding:3px 5px; margin-left:-5px; border-radius:4px; cursor:text;
  transition:background .13s, box-shadow .13s; }
.tp-t:hover { background:#F4F7FD; }
.tp-d { font:500 13px/23px ui-sans-serif,system-ui,sans-serif; color:#828FA3;
  margin:0 0 18px; padding:3px 5px; margin-left:-5px; border-radius:4px; cursor:text;
  transition:background .13s; }
.tp-d:hover { background:#F4F7FD; }
.tp-edit { width:100%; box-sizing:border-box; display:block; font:inherit; color:#000112;
  background:#fff; border:2px solid #635FC7; border-radius:4px; padding:2px 4px;
  margin-left:-5px; outline:none; resize:none; }
.tp-lab { font:700 12px/15px ui-sans-serif,system-ui,sans-serif; color:#828FA3; margin-bottom:8px; }
.tp-st { display:flex; align-items:center; gap:10px; background:#F4F7FD; border-radius:4px;
  padding:9px 11px; margin-bottom:7px; cursor:pointer;
  font:700 12px/15px ui-sans-serif,system-ui,sans-serif; color:#000112;
  transition:background .13s; }
.tp-st:hover { background:#EDF0F8; }
.tp-st i { width:15px; height:15px; border-radius:3px; border:1px solid #E4EBFA; background:#fff;
  flex:none; display:grid; place-items:center; transition:background .13s, border-color .13s; }
.tp-st.on i { background:#635FC7; border-color:#635FC7; }
.tp-st.on i::after { content:"✓"; color:#fff; font-size:10px; line-height:1; }
.tp-st.on span { color:#828FA3; text-decoration:line-through; }
.tp-add { font:600 12px/1 ui-sans-serif,system-ui,sans-serif; color:#635FC7; cursor:pointer;
  padding:8px 11px; display:inline-block; border-radius:4px; transition:background .13s; }
.tp-add:hover { background:#F4F7FD; }
.tp-sel { margin-top:6px; border:1px solid #E4EBFA; border-radius:4px; padding:9px 11px;
  font:500 13px/1 ui-sans-serif,system-ui,sans-serif; color:#000112; cursor:pointer; }
.tp-hint { margin-top:16px; padding-top:12px; border-top:1px solid #E4EBFA;
  font:500 11px/1.6 ui-sans-serif,system-ui,sans-serif; color:#9AA3B2; }

/* ---- C: the expansion animates. grid 0fr→1fr is the only way to transition to auto height,
        and the cards below are genuinely displaced, so rule 2 permits the geometry. ---- */
.tp-inl { display:grid; grid-template-rows:0fr; opacity:0;
  transition:grid-template-rows var(--d) var(--e), opacity calc(var(--d)*.7) var(--e),
             margin-top var(--d) var(--e), padding-top var(--d) var(--e);
  margin-top:0; padding-top:0; border-top:1px solid transparent; }
.tp-inl > div { overflow:hidden; min-height:0; }
.tp-card.inline-open .tp-inl { grid-template-rows:1fr; opacity:1;
  margin-top:12px; padding-top:12px; border-top-color:#E4EBFA; }
.tp-card.inline-open { cursor:default; }

/* ---- panel close affordance: no scrim, so it needs a real control ---- */
.tp-head { display:flex; align-items:flex-start; gap:10px; }
.tp-head .tp-t { flex:1; }
.tp-x { flex:none; width:28px; height:28px; border-radius:4px; border:1px solid #E4EBFA;
  background:#fff; color:#828FA3; cursor:pointer; font:400 15px/1 ui-sans-serif,system-ui,sans-serif;
  display:grid; place-items:center; transition:background .13s, border-color .13s, color .13s; }
.tp-x:hover { background:#FAFBFE; border-color:#D6DFEF; color:#000112; }
.tp-esc { font:500 11px/1 ui-monospace,Menlo,monospace; color:#9AA3B2; margin-left:8px; }
.tp-warn { margin-top:12px; padding:9px 11px; border-radius:4px; background:#FDF3E7;
  border:1px solid #E8CFA6; font:600 11px/1.5 ui-sans-serif,system-ui,sans-serif; color:#7A5B1E; }
</style>

<script>
const COLS = [
  ["TODO","#49C4E5",[0,1]], ["DOING","#8471F2",[2,3,4]], ["DONE","#67E2AE",[5,6]],
];
const T = [
  { t:"Research pricing", d:"Compare the three vendor tiers and write up which one clears the compliance bar.", s:[["Pull tier sheets",1],["Check SOC2",0],["Write summary",0]] },
  { t:"Audit empty states", d:"Every surface that can be empty needs a designed empty state, not a blank panel.", s:[["List surfaces",1],["Design each",0]] },
  { t:"Build settings UI", d:"We know what buttons we need, but the styling of the settings screen is still undecided.", s:[["Sketch layout",1],["Pick controls",1],["Wire state",0]] },
  { t:"Design settings and search", d:"Search has to work across boards, not just the open one.", s:[["Scope search",1],["Draft UI",0]] },
  { t:"Vendor shortlist", d:"Narrow eleven vendors to three we would actually sign with.", s:[["Collect list",1],["Score them",0],["Cut to five",0],["Final three",0]] },
  { t:"Add account auth", d:"Sign-in, sign-up and session handling against the real backend.", s:[["Sign in",1],["Sign up",1],["Sessions",1]] },
  { t:"Billing page", d:"Show the current plan and let a user change it.", s:[["Plan display",1],["Change flow",1]] },
];

const NOTES = {
  modal:`<b>A &mdash; centred modal.</b> The scrim hides the board, so the column the task belongs to stops being visible. This is the option that needs the 414px morph and therefore <code>startViewTransition()</code> &mdash; the phase's only rule-5 carve-out.`,
  panel:`<b>B &mdash; closing it.</b> With no scrim there is nothing to "click out of" &mdash; everything outside stays live, which is the whole point. So it closes like the sidebar, not like a dialog: the <b>✕</b>, <b>Esc</b>, or <b>clicking the same card again</b>. Clicking a <em>different</em> card swaps the contents and never closes. The board stays operable throughout, so closing is optional rather than something the UI demands of you.`,
  inline:`<b>C &mdash; now animated.</b> The expansion runs on <code>grid-template-rows: 0fr→1fr</code>, the only way to transition to an automatic height &mdash; and the cards below are genuinely displaced, so rule 2 permits the geometry. The 280px-vs-448px constraint is unchanged.`,
};

const stage=document.getElementById("tpStage"), boardEl=document.getElementById("tpBoard"),
      scrollEl=document.getElementById("tpScroll"), panelInner=document.getElementById("tpInner"),
      modalEl=document.getElementById("tpModal"), note=document.getElementById("tpNote");
let opt="panel", open=null;

// ---------- board ----------
boardEl.innerHTML = COLS.map(([n,c,ids]) => `
  <div class="tp-col">
    <div class="tp-colh"><i style="background:${c}"></i>${n} <span>(${ids.length})</span></div>
    ${ids.map(i=>`<div class="tp-card" data-t="${i}">
        <b>${T[i].t}</b>
        <div class="tp-p"><s><u style="width:${pct(i)}%"></u></s><span>${done(i)}/${T[i].s.length}</span></div>
      </div>`).join("")}
  </div>`).join("");

function done(i){ return T[i].s.filter(x=>x[1]).length; }
function pct(i){ return Math.round(done(i)/T[i].s.length*100); }

function syncCard(i){
  const c = boardEl.querySelector(`.tp-card[data-t="${i}"]`);
  c.querySelector("b").textContent = T[i].t;
  c.querySelector("u").style.width = pct(i)+"%";
  c.querySelector(".tp-p span").textContent = `${done(i)}/${T[i].s.length}`;
}

// ---------- detail body, with inline editing ----------
function detail(i, withClose){
  const x = T[i];
  return `${withClose
      ? `<div class="tp-head"><div class="tp-t" data-ed="t">${x.t}</div>
           <button class="tp-x" id="tpX" title="Close (Esc)">✕</button></div>`
      : `<div class="tp-t" data-ed="t">${x.t}</div>`}
    <div class="tp-d" data-ed="d">${x.d}</div>
    <div class="tp-lab">Subtasks (${done(i)} of ${x.s.length})</div>
    <div id="tpSubs">${x.s.map((s,n)=>`<div class="tp-st ${s[1]?"on":""}" data-s="${n}"><i></i><span>${s[0]}</span></div>`).join("")}</div>
    <div class="tp-add">+ Add subtask</div>
    <div class="tp-lab" style="margin-top:16px">Current status</div>
    <div class="tp-sel">Doing</div>
    <div class="tp-hint">Title, description and subtasks are edited here &mdash; there is no second modal.
      Each uses the optimistic hooks plans 04-18 and 04-19 already build.</div>`;
}

function wire(root, i){
  root.querySelectorAll("[data-ed]").forEach(el => el.onclick = () => {
    const isT = el.dataset.ed === "t";
    const ed = document.createElement(isT ? "input" : "textarea");
    ed.className = "tp-edit"; ed.value = isT ? T[i].t : T[i].d;
    if (!isT) ed.rows = 3;
    ed.style.font = getComputedStyle(el).font;
    el.replaceWith(ed); ed.focus(); ed.select?.();
    const commit = () => {
      if (isT) T[i].t = ed.value.trim() || T[i].t; else T[i].d = ed.value.trim() || T[i].d;
      render(); syncCard(i);
    };
    ed.onblur = commit;
    ed.onkeydown = e => { if (e.key === "Enter" && isT) commit(); if (e.key === "Escape") render(); };
  });
  root.querySelectorAll("[data-s]").forEach(el => el.onclick = () => {
    const n = +el.dataset.s; T[i].s[n][1] = T[i].s[n][1] ? 0 : 1;
    render(); syncCard(i);
  });
  root.querySelector(".tp-add").onclick = () => {
    T[i].s.push(["New subtask", 0]); render(); syncCard(i);
  };
}

const panelEl = document.getElementById("tpPanel");
function revealAfterPanel(card){
  const go = () => card.scrollIntoView({ block:"nearest", inline:"nearest" });
  panelEl.addEventListener("transitionend", function once(e){
    if (e.propertyName !== "width") return;
    panelEl.removeEventListener("transitionend", once);
    go();
  });
  if (stage.classList.contains("is-panel") && panelEl.getBoundingClientRect().width === 400) go();
}

// ---------- render ----------
function render(){
  note.innerHTML = NOTES[opt];
  boardEl.querySelectorAll(".tp-card").forEach(c=>{
    c.classList.remove("is-open","inline-open");
    c.querySelector(".tp-inl")?.remove();
  });
  stage.classList.remove("is-panel","is-modal");
  if (open === null) { panelInner.innerHTML = ""; return; }

  const card = boardEl.querySelector(`.tp-card[data-t="${open}"]`);
  card.classList.add("is-open");

  if (opt === "panel") {
    panelInner.innerHTML = detail(open, true);
    stage.classList.add("is-panel");
    wire(panelInner, open);
    panelInner.querySelector("#tpX").onclick = () => { open = null; render(); };
    // The scroll container is still narrowing while the panel opens, so scrolling now aims at a
    // target that is still moving — the card ends up under the panel. Wait for the width to land.
    revealAfterPanel(card);
  } else if (opt === "modal") {
    modalEl.innerHTML = detail(open);
    stage.classList.add("is-modal");
    wire(modalEl, open);
  } else {
    const d = document.createElement("div");
    d.className = "tp-inl";
    // grid 0fr→1fr needs a single child to clip; the transition only runs if the element is in
    // the DOM at 0fr for a frame before the class flips it to 1fr.
    d.innerHTML = `<div>${detail(open).replace(/<div class="tp-t".*?<\/div>/, "")}
      <div class="tp-warn">280px column vs 448px of content.</div></div>`;
    card.appendChild(d);
    requestAnimationFrame(() => card.classList.add("inline-open"));
    wire(d, open);
  }
}

boardEl.querySelectorAll(".tp-card").forEach(c => c.onclick = e => {
  if (e.target.closest(".tp-inl")) return;
  const i = +c.dataset.t;
  open = (open === i) ? null : i;   // same card toggles shut; a different card swaps, never closes
  render();
});
addEventListener("keydown", e => { if (e.key === "Escape" && open !== null) { open = null; render(); } });
document.querySelectorAll(".tp-opt").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tp-opt").forEach(o=>o.classList.toggle("is-on", o===b));
  opt = b.dataset.opt; render();
});
document.getElementById("tpClose").onclick = () => { open=null; render(); };
document.getElementById("tpScrim").onclick = () => { open=null; render(); };
document.getElementById("tpSlow").onclick = e => {
  const on = stage.classList.toggle("slow");
  e.target.textContent = "Slow motion: " + (on?"on":"off");
};
render();
</script>
