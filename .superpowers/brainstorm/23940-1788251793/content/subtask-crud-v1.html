<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subtask CRUD — v1</title>
<style>
/* ============================================================================
   SUBTASK CREATE / RENAME / DELETE, on the panel.

   Why this file exists
   -------------------
   The matrix records subtask rename and delete as ❌, and records WHY the
   obvious target is wrong: both live in `subtask-editor-row`, which is used
   only by `add-task-modal` and `edit-task-modal` — and Phase 5's adopted panel
   direction deletes `EditTaskModal`. Designing them there designs a surface
   that is being removed.

   So the target is the panel, and `task-open-v17` is the parent: it already
   makes the title and description `contenteditable` on the same element, and
   it already appends a subtask row live. What it does NOT have is a rename
   affordance on a subtask label, any removal at all, or a single frame of
   motion on the add — `appendChild`, and the row is simply there.

   What the mock actually says (checked, rather than assumed)
   ----------------------------------------------------------
   p37, the view-task modal: subtask rows are read-only tinted pills — a
   checkbox, a label, a strike-through when done. There is NO rename and NO
   delete affordance on this surface at all.

   p39, the edit-task modal: subtask rows are text inputs, each with a **✕ to
   the right, outside the field**, above a `+ Add New Subtask` pill.

   So the mock's answer is "they live in the other modal", and the other modal
   is the one being deleted. This surface therefore has no mock state, which
   rubric check 5 says to SAY rather than to fill in with invention. The two
   things carried over rather than invented:

     - the ✕, at the row's right edge, muted until hover (mock p39);
     - the editable label, which is `task-open-v17`'s own established
       title/description treatment applied to a third field, not a new idea.

   The one genuinely new decision is which click does what, and it is forced:
   the mock's whole row is the toggle target, and toggling is the frequent
   action. So the row keeps it, and rename gets an explicit ✎ — the same
   affordance the panel already shows on hover for the title.
   ============================================================================ */

:root {
  --e: cubic-bezier(.2,0,0,1);
  --slow: 1;
  --purple: #635FC7;
  --red: #EA5555;
  --ink: #000112;
  --muted: #828FA3;
  --line: #E4EBFA;
  --tint: #F4F7FD;
}
* { box-sizing: border-box; }
body { margin: 0; background: #F4F7FD; color: var(--ink);
  font: 500 13px/1.5 ui-sans-serif, system-ui, sans-serif; }

.wrap { display: flex; gap: 28px; align-items: flex-start; padding: 28px; }
.panel { width: 400px; background: #fff; border-radius: 6px; padding: 24px;
  box-shadow: 0 4px 6px rgba(54,78,126,.10); }
.ttl { font: 700 18px/23px ui-sans-serif, system-ui, sans-serif; margin: 0 0 10px; }
.desc { color: var(--muted); font: 500 13px/23px ui-sans-serif, system-ui, sans-serif; margin: 0 0 18px; }
.lab { font: 700 12px/15px ui-sans-serif, system-ui, sans-serif; color: var(--muted); margin-bottom: 8px; }

/* ---------------------------------------------------------------- the row */
.st { display: flex; align-items: center; gap: 10px; background: var(--tint);
  border-radius: 4px; padding: 9px 11px; cursor: pointer;
  font: 700 12px/15px ui-sans-serif, system-ui, sans-serif; color: var(--ink);
  transition: background .13s; }
.st:hover { background: #EDF0F8; }

/*
 * The row is wrapped, and the WRAPPER is what collapses.
 *
 * `height` cannot interpolate from `auto`, and putting the height on the row
 * itself would fight its own padding during the collapse — the text reflows to
 * two lines on the way down and the motion visibly stutters. A wrapper with
 * `overflow: hidden` lets the row keep its natural box the whole way while the
 * window over it closes, which is the only version where the label does not
 * re-wrap mid-flight.
 *
 * The margin lives on the wrapper for the same reason: a collapsing row whose
 * margin does not collapse with it leaves a 7px gap behind that snaps shut a
 * frame later, and two closings in sequence is #40 again in a different body.
 */
.strow { overflow: hidden; margin-bottom: 7px; }
/*
 * THE BOX AND ITS CONTENTS ARE NOT ON THE SAME CLOCK, deliberately — and the
 * first version's mistake was giving them the same one.
 *
 * With both at 200ms, the phase curve `cubic-bezier(.2,0,0,1)` is so
 * front-loaded that the box is nearly shut long before a linear opacity has
 * faded: measured at **85ms, height 9px, opacity 0.58**. The label is then
 * being clipped by a closing window rather than leaving, which reads as the
 * text being guillotined.
 *
 * Matching the curves does not fix it, it inverts it: an opacity on the same
 * front-loaded easing empties the row in the first third and leaves an empty
 * box shrinking — #43's hole in a smaller body.
 *
 * So they are sequenced, and the ORDER differs by direction, because a leave
 * and an enter are not the same event reversed:
 *
 *   leaving  — contents go FIRST (90ms), then the box closes over 200ms. The
 *              tail is a gap shutting, which is the space being reclaimed and
 *              is the thing the user should actually see.
 *   entering — the box opens FIRST, contents arrive at the end (110ms delayed
 *              by 90ms, landing with it). Filling a box that is already open is
 *              two beats; arriving with it is one.
 */
.strow.animating { transition:
    height calc(200ms * var(--slow)) var(--e),
    margin-bottom calc(200ms * var(--slow)) var(--e),
    opacity calc(90ms * var(--slow)) linear; }
.strow.animating.entering { transition:
    height calc(200ms * var(--slow)) var(--e),
    margin-bottom calc(200ms * var(--slow)) var(--e),
    opacity calc(110ms * var(--slow)) linear calc(90ms * var(--slow)); }
/*
 * NO `.collapsed` CLASS, and its absence is the load-bearing part.
 *
 * The first version seeded the start value inline (`style.height = "48px"`,
 * because a transition cannot interpolate from `auto`) and then added a
 * `.collapsed { height: 0 }` class as the target. An inline declaration beats
 * any class, so the height never changed, no transition started, the
 * `getAnimations()` query came back EMPTY, and the row was deleted in a single
 * frame — measured n=2 at t=4ms with `anim: []`.
 *
 * Both ends therefore have to be set through the same channel. This is
 * defect-log rule 1's sibling: rule 1 says an inline `transition` silently
 * replaces the stylesheet's whole list; this says an inline VALUE silently
 * outranks the class meant to change it. Seeding a start value inline commits
 * you to setting the end value inline too.
 */

.st i { width: 15px; height: 15px; border-radius: 3px; border: 1px solid var(--line);
  background: #fff; flex: none; display: grid; place-items: center;
  transition: background .13s, border-color .13s; }
.st i svg { width: 9px; height: 9px; display: block; }
.st i path { stroke: #fff; stroke-width: 2.4; fill: none; stroke-linecap: round;
  stroke-linejoin: round; stroke-dasharray: 14; stroke-dashoffset: 14;
  transition: stroke-dashoffset .22s var(--e); }
.st i.on { background: var(--purple); border-color: var(--purple); }
.st i.on path { stroke-dashoffset: 0; }

/* ------------------------------------------------------- the label, editable */
/*
 * TWO PURPOSES, TWO PSEUDO-ELEMENTS — and this is not a style preference.
 *
 * `task-open-v17` draws the strike-through with `span::after` (a line that
 * scales across the letters, so no transform ever touches text). Its editable
 * fields draw the hover pencil with `.tp-ed::after`. Making the subtask label
 * both an editable field and a strike-through host puts two unrelated jobs on
 * ONE pseudo-element, and whichever rule is written later silently wins — the
 * pencil replaces the strike-through on every completed subtask, or the line
 * replaces the pencil on every row.
 *
 * That is defect-log rule 9 ("one element, one property, two states that can be
 * true at once") arriving through a pseudo-element rather than a class: a
 * completed subtask being renamed needs BOTH at once, so they cannot share a
 * slot. The strike-through keeps `::after`, the pencil moves to `::before`.
 */
.stlab { position: relative; flex: 1 1 auto; min-width: 0;
  border-radius: 3px; padding: 2px 4px; margin: -2px -4px;
  transition: color .22s, background .13s, outline-color .13s;
  outline: 2px solid transparent; outline-offset: 0; }
.stlab::after { content: ""; position: absolute; left: 4px; right: 4px; top: 52%;
  height: 1.5px; background: currentColor; border-radius: 1px;
  transform: scaleX(0); transform-origin: left center;
  transition: transform .28s var(--e); }
.st.on .stlab { color: #9AA3B2; }
.st.on .stlab::after { transform: scaleX(1); }

/* The pencil. `::before`, for the reason above. */
.stlab::before { content: "\270E"; position: absolute; right: -16px; top: 1px;
  font: 400 12px/1.4 ui-sans-serif, system-ui, sans-serif; color: #A9B0C0;
  opacity: 0; transition: opacity .13s; pointer-events: none; }
.st:hover .stlab::before { opacity: 1; }

/*
 * Editing suppresses the strike-through's own transition rather than the line.
 * A completed subtask entering edit keeps its line — it is still completed —
 * and the line must not re-draw itself across 280ms every time the caret lands.
 */
.stlab:focus { background: #fff; outline-color: var(--purple); cursor: text; }
.stlab:focus::before { opacity: 0; }
.st.editing { background: #fff; cursor: default; }
.st.editing .stlab::after { transition: none; }

/* ------------------------------------------------------------------ the ✕ */
/*
 * Mock p39 puts this to the RIGHT of the field, outside it. Here the row is the
 * field, so it sits at the row's right edge inside the pill — the same place,
 * relative to the material it acts on.
 *
 * `visibility` rather than `display`, so it can transition, and so it takes its
 * own hit area with it when hidden — `opacity: 0` alone leaves an invisible
 * button swallowing clicks meant for the row's toggle.
 */
.stx { flex: none; width: 18px; height: 18px; margin: -4px -4px -4px 0; padding: 0;
  border: 0; background: none; border-radius: 3px; cursor: pointer; color: #A9B0C0;
  font: 400 13px/1 ui-sans-serif, system-ui, sans-serif;
  opacity: 0; visibility: hidden;
  transition: opacity .13s, color .13s, background .13s; }
.st:hover .stx { opacity: 1; visibility: visible; }
.stx:hover { color: var(--red); background: rgba(234,85,85,.10); }
.stx:focus-visible { opacity: 1; visibility: visible; outline: 2px solid var(--purple); }

/* ----------------------------------------------------------- add / empty */
.add { font: 600 12px/1 ui-sans-serif, system-ui, sans-serif; color: var(--purple);
  cursor: pointer; padding: 8px 11px; display: inline-block; border-radius: 4px;
  transition: background .13s; border: 0; background: none; }
.add:hover { background: var(--tint); }

/*
 * ZERO SUBTASKS. The mock has no state for this either — a task with no
 * subtasks simply is not drawn in it. Rubric check 5's ladder is
 * type → spacing → outline → fill, and type answers it: a line saying so, in
 * the label's own muted voice. No box, no dashed well, no invented surface —
 * which is exactly the mistake #37 was.
 */
.subs:empty + .none { display: block; }
.none { display: none; color: #A9B0C0;
  font: 500 12px/16px ui-sans-serif, system-ui, sans-serif; padding: 2px 2px 6px; }

.sel { margin-top: 16px; border: 1px solid var(--line); border-radius: 4px;
  padding: 9px 11px; font: 500 13px/1 ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
.sellab { font: 700 12px/15px ui-sans-serif, system-ui, sans-serif; color: var(--muted);
  margin: 16px 0 8px; }

/* ------------------------------------------------------------------ rig */
.rig { font: 500 12px/1.7 ui-monospace, monospace; color: #4a5568; min-width: 250px; }
.rig h3 { font: 700 12px/1.4 ui-sans-serif, system-ui, sans-serif; margin: 0 0 8px; }
.rig label { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel" id="panel">
    <h2 class="ttl">Research pricing points of various competitors</h2>
    <p class="desc">We know what we're planning to build for version one. Now we need to finalise
      the first pricing model we'll use.</p>

    <div class="lab">Subtasks (<span id="done">0</span> of <span id="total">0</span>)</div>
    <div class="subs" id="subs"></div>
    <div class="none">No subtasks yet.</div>
    <button class="add" id="add">+ Add subtask</button>

    <div class="sellab">Current status</div>
    <div class="sel">Doing</div>
  </div>

  <div class="rig">
    <h3>Rig</h3>
    <label><input type="checkbox" id="slow"> slow motion (6&times;)</label>
    <label><button class="add" id="reset" style="padding:4px 8px">reset</button></label>
    <p id="state"></p>
  </div>
</div>

<script>
const TICK = `<svg viewBox="0 0 12 12"><path d="M2.5 6.2 L5 8.6 L9.5 3.4"/></svg>`;
const SEED = [
  ["Research competitor pricing and business models", 1],
  ["Outline a business model that works for our solution", 1],
  ["Talk to potential customers about our proposed solution", 0],
];
let S = SEED.map((s) => s.slice());

const subs = document.getElementById("subs");
const doneEl = document.getElementById("done");
const totalEl = document.getElementById("total");
const SLOW = () => Number(getComputedStyle(document.documentElement).getPropertyValue("--slow")) || 1;

document.getElementById("slow").onchange = (e) =>
  document.documentElement.style.setProperty("--slow", e.target.checked ? 6 : 1);

/*
 * The counts are written from the MODEL, never incremented. A subtask being
 * deleted changes `total` always and `done` only if it was ticked, and an
 * off-by-one in the second case is exactly the class of bug rubric check 6
 * exists for — "removes its 0 tasks" was the same mistake counted the other
 * way. Recomputing both from `S` cannot drift.
 */
function counts() {
  doneEl.textContent = String(S.filter((s) => s[1]).length);
  totalEl.textContent = String(S.length);
  document.getElementById("state").textContent =
    `${S.length} row(s) · ${S.filter((s) => s[1]).length} done`;
}

function rowNode(text, on) {
  const wrap = document.createElement("div");
  wrap.className = "strow";
  wrap.innerHTML =
    `<div class="st${on ? " on" : ""}">` +
      `<i class="${on ? "on" : ""}">${TICK}</i>` +
      `<span class="stlab" contenteditable="plaintext-only" spellcheck="false"` +
      ` role="textbox" tabindex="0"></span>` +
      `<button class="stx" title="Delete subtask">&#10005;</button>` +
    `</div>`;
  wrap.querySelector(".stlab").textContent = text;
  return wrap;
}

/*
 * Index by NODE, not by a `data-s` ordinal.
 *
 * `task-open-v17` addresses rows with `data-s="<n>"` read back out of the DOM.
 * That is stable only while rows are append-only, which is precisely what
 * delete ends: removing row 1 of 3 leaves rows numbered 0 and 2, and the next
 * click either edits the wrong subtask or writes past the end of the array.
 * A WeakMap-free `indexOf` on the live node list has no ordinal to go stale.
 *
 * A row that is still COLLAPSING is out of the model already but still in the
 * DOM for another 200ms, so it has to be excluded or every row beneath it
 * resolves one too high for the length of the animation — the same off-by-one
 * arriving through time rather than through a stale ordinal. Deleting two rows
 * in quick succession is the state that reaches it, which is rubric check 1's
 * "again while the previous one is still finishing".
 */
const live = () => [...subs.children].filter((n) => !n.classList.contains("leaving"));
const rowIndex = (wrap) => live().indexOf(wrap);

function wire(wrap) {
  const row = wrap.querySelector(".st");
  const label = wrap.querySelector(".stlab");
  const x = wrap.querySelector(".stx");

  row.addEventListener("click", (e) => {
    /* The label and the ✕ own their own clicks; the rest of the row toggles. */
    if (e.target === label || label.contains(e.target) || e.target === x) return;
    const i = rowIndex(wrap);
    S[i][1] = S[i][1] ? 0 : 1;
    row.classList.toggle("on", !!S[i][1]);
    row.querySelector("i").classList.toggle("on", !!S[i][1]);
    counts();
  });

  label.addEventListener("focus", () => row.classList.add("editing"));
  label.addEventListener("blur", () => {
    row.classList.remove("editing");
    const i = rowIndex(wrap);
    const v = label.textContent.trim();
    if (v) S[i][0] = v; else label.textContent = S[i][0];
    counts();
  });
  label.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); label.blur(); }
    if (e.key === "Escape") { label.textContent = S[rowIndex(wrap)][0]; label.blur(); }
  });

  x.addEventListener("click", (e) => { e.stopPropagation(); remove(wrap); });
}

/*
 * ENTER and LEAVE are one function read in two directions, because they have to
 * be each other's mirror to read as one gesture. Writing them as two handlers is
 * how the add ends up at 200ms ease-out and the delete at 180ms linear, and the
 * pair then reads as two different mechanisms operating on the same list.
 */
function animateHeight(wrap, dir, after) {
  const shut = { height: "0px", marginBottom: "0px", opacity: "0" };
  const open = { height: `${wrap.scrollHeight}px`, marginBottom: "7px", opacity: "1" };
  const [from, to] = dir === "in" ? [shut, open] : [open, shut];
  Object.assign(wrap.style, from);
  void wrap.offsetHeight;                   /* commit the start box with no transition */
  wrap.classList.add("animating");
  if (dir === "in") wrap.classList.add("entering");
  Object.assign(wrap.style, to);
  /*
   * Ask the animation, do not listen for it — #42. `.strow.animating`
   * transitions three properties at the same duration, so which one reports
   * first is arbitrary, and a listener cannot tell a late `transitionend` from
   * one that never fires because the transition never started.
   */
  void wrap.offsetWidth;
  const anim = wrap.getAnimations().find((a) => a.transitionProperty === "height");
  const settle = () => {
    wrap.classList.remove("animating", "entering");
    if (dir === "in") {
      /* Back to `auto` on every property, so a later rename may re-wrap the label. */
      wrap.style.removeProperty("height");
      wrap.style.removeProperty("margin-bottom");
      wrap.style.removeProperty("opacity");
    }
    after && after();
  };
  if (anim) anim.finished.then(settle, settle);
  else settle();
}

function add() {
  S.push(["New subtask", 0]);
  const wrap = rowNode("New subtask", 0);
  subs.appendChild(wrap);
  wire(wrap);
  counts();                                  /* the count commits with the gesture, not after it */
  animateHeight(wrap, "in", () => {
    const label = wrap.querySelector(".stlab");
    label.focus();
    getSelection().selectAllChildren(label); /* a new row exists to be named */
  });
}

function remove(wrap) {
  const i = rowIndex(wrap);
  if (i < 0) return;                          /* already leaving */
  S.splice(i, 1);
  wrap.classList.add("leaving");
  counts();
  animateHeight(wrap, "out", () => wrap.remove());
}

function render() {
  subs.textContent = "";
  S.forEach(([t, on]) => { const w = rowNode(t, on); subs.appendChild(w); wire(w); });
  counts();
}

document.getElementById("add").onclick = add;
document.getElementById("reset").onclick = () => { S = SEED.map((s) => s.slice()); render(); };
render();
</script>
</body>
</html>
