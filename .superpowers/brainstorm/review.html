<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phase 5 — sign-off review</title>
<!--
  One page over the 26 adopted prototypes, in the order of
  docs/superpowers/specs/2026-09-10-phase-5-handover-ledger.md.

  Not a second index: index.html is the archive of the whole set including superseded
  revisions, this is the review surface for the adopted ones only. Each row carries what it
  already decided, what to actually look at, and a verdict that persists in localStorage —
  so a session can be interrupted, and so "approved" is a recorded answer rather than silence.
-->
<style>
  :root{
    --bg:#0f1117; --panel:#161923; --line:#242938; --line2:#2f3547;
    --ink:#e6e9f2; --dim:#9aa3b8; --dim2:#6f7a8f;
    --ok:#7fc98a; --no:#e08a7a; --wait:#c9b37f; --acc:#8b87f0;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:grid;grid-template-columns:290px 1fr;background:var(--bg);color:var(--ink);
    font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }

  /* ── rail ───────────────────────────────────────────────────────────── */
  #rail{border-right:1px solid var(--line);overflow-y:auto;background:var(--panel)}
  #railhead{padding:14px 14px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
  #railhead h1{margin:0 0 2px;font-size:13px;letter-spacing:.2px}
  #railhead p{margin:0;color:var(--dim);font-size:11px}
  #prog{margin-top:9px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
  #prog i{display:block;height:100%;width:0;background:var(--ok);transition:width 180ms cubic-bezier(.2,0,0,1)}
  #progtxt{margin-top:6px;font:11px/1.2 var(--mono);color:var(--dim)}
  .grp{padding:13px 14px 5px;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim2)}
  .row{
    display:grid;grid-template-columns:26px 1fr 12px;gap:8px;align-items:center;
    padding:7px 14px;cursor:pointer;border-left:2px solid transparent;color:var(--ink);
  }
  .row:hover{background:#1c2030}
  .row[data-on=true]{background:#1f2434;border-left-color:var(--acc)}
  .row .id{font:11px/1 var(--mono);color:var(--dim2)}
  .row .nm{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .dot{width:8px;height:8px;border-radius:50%;background:var(--line2)}
  .row[data-v=ok] .dot{background:var(--ok)}
  .row[data-v=no] .dot{background:var(--no)}
  .row[data-v=wait] .dot{background:var(--wait)}

  /* ── stage ──────────────────────────────────────────────────────────── */
  #stage{display:grid;grid-template-rows:auto 1fr auto;min-width:0;min-height:0}
  #bar{
    display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);
    background:var(--panel);flex-wrap:wrap;
  }
  #bar h2{margin:0;font-size:13px}
  #bar .path{font:11px/1 var(--mono);color:var(--dim2)}
  .tag{font-size:10px;letter-spacing:.5px;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid var(--line2);color:var(--dim)}
  .tag[data-s=signed]{color:var(--ok);border-color:#2f4a36}
  .spacer{flex:1}
  button{
    font:inherit;font-size:12px;color:var(--ink);background:#1e2333;border:1px solid var(--line2);
    border-radius:4px;padding:4px 10px;cursor:pointer;
  }
  button:hover{background:#262c40}
  button[data-on=true]{border-color:var(--acc);background:#272456}
  iframe{width:100%;height:100%;border:0;background:#fff}
  #framewrap{position:relative;min-height:0;background:#fff}
  #noslow{
    position:absolute;right:10px;bottom:10px;background:#0f1117d0;color:var(--dim);
    padding:4px 8px;border-radius:4px;font:11px/1 var(--mono);display:none;
  }

  /* ── verdict drawer ─────────────────────────────────────────────────── */
  #drawer{border-top:1px solid var(--line);background:var(--panel);display:grid;grid-template-columns:1fr 300px;gap:0}
  #facts{padding:11px 14px;overflow-y:auto;max-height:210px}
  #facts h4{margin:0 0 5px;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim2)}
  #facts ul{margin:0 0 10px;padding-left:16px;color:var(--dim)}
  #facts li{margin:2px 0}
  #facts code{font:11px/1.4 var(--mono);color:#b9c2d8;background:#1c2030;padding:1px 4px;border-radius:3px}
  #facts .watch li{color:#cfd5e6}
  #verdict{border-left:1px solid var(--line);padding:11px 14px;display:flex;flex-direction:column;gap:8px}
  #verdict .btns{display:flex;gap:6px}
  #verdict .btns button{flex:1}
  #verdict button[data-v=ok][data-on=true]{border-color:var(--ok);background:#1d3324;color:var(--ok)}
  #verdict button[data-v=no][data-on=true]{border-color:var(--no);background:#33201d;color:var(--no)}
  #verdict button[data-v=wait][data-on=true]{border-color:var(--wait);background:#332d1d;color:var(--wait)}
  textarea{
    flex:1;min-height:56px;resize:none;background:#12151f;color:var(--ink);border:1px solid var(--line2);
    border-radius:4px;padding:7px 8px;font:12px/1.45 inherit;
  }
  textarea:focus{outline:none;border-color:var(--acc)}
  #kbd{font:10px/1.6 var(--mono);color:var(--dim2)}
  #kbd b{color:var(--dim)}
</style>
</head>
<body>

<nav id="rail">
  <div id="railhead">
    <h1>Phase 5 — sign-off</h1>
    <p>The 28 adopted prototypes, in ledger order.</p>
    <div id="prog"><i></i></div>
    <div id="progtxt"></div>
  </div>
  <div id="list"></div>
</nav>

<main id="stage">
  <div id="bar">
    <h2 id="title"></h2>
    <span class="tag" id="status"></span>
    <span class="path" id="path"></span>
    <span class="spacer"></span>
    <button id="slowbtn" title="Ticks the prototype's own slow-motion checkbox">slow 6×</button>
    <button id="reducedbtn" title="Ticks the prototype's own reduced-motion checkbox">reduced motion</button>
    <button id="replay" title="Reload the frame so an entry animation can be watched again">replay ⟲</button>
    <button id="open" title="Open this prototype in its own tab">open ↗</button>
    <button id="report">copy report</button>
  </div>

  <div id="framewrap">
    <iframe id="frame" title="prototype"></iframe>
    <div id="noslow">this prototype has no rig toggle</div>
  </div>

  <div id="drawer">
    <div id="facts">
      <h4>Already decided — this is what it is showing you</h4>
      <ul id="decides"></ul>
      <h4>Watch for — measured to break here before</h4>
      <ul class="watch" id="watch"></ul>
    </div>
    <div id="verdict">
      <div class="btns">
        <button data-v="ok">approve</button>
        <button data-v="no">rework</button>
        <button data-v="wait">unsure</button>
      </div>
      <textarea id="note" placeholder="What is wrong with it, in your words. Saved as you type."></textarea>
      <div id="kbd"><b>j</b>/<b>k</b> move · <b>a</b>/<b>r</b>/<b>u</b> verdict · <b>s</b> slow · <b>enter</b> replay</div>
    </div>
  </div>
</main>

<script>
const S1 = "23940-1788251793/content/";
const S2 = "316005-1788260529/content/";

/*
 * One entry per row of the handover ledger's table A. `decides` is what the row settles, so a
 * viewer knows what they are being asked to approve; `watch` is drawn from the ledger's decision
 * ledger and the defect log — the things that have already been got wrong on this surface, which
 * is what a reviewer's eye is actually worth spending on.
 */
const ROWS = [
  { grp:"Material & identity" },
  { id:"A1", name:"Card material", file:S1+"material-v2.html",
    decides:["Hairline border replaces shadow; shadow demoted to <code>0 1px 2px rgba(16,18,32,.04)</code> and dropped in dark.","Card padding 14px, gutter 10px — ~40% more cards per column.","Hover = border + surface + 2px purple left grab-rail, 130ms."],
    watch:["Hover must change <b>colour only</b> — no geometry. A 1px translateY read as the card swelling.","The rail and the hover must be visible without being loud: the same treatment failed once at max channel delta 5."] },
  { id:"A2", name:"Buttons — press & pending", file:S1+"buttons-v4.html", status:"signed",
    decides:["4px radius replaces <code>rounded-full</code>, app-wide.","Press is <code>translate: 0 2px</code> with the bottom edge collapsing to 0.","Pending .75 / disabled .5 <b>hold</b> the pressed geometry."],
    watch:["Hover is a flat <code>::after</code> wash — a darkened saturated fill reads as dirt, and an animated hard edge is the jerk reported four times.","<code>danger</code> washes with ink, not light: white on <code>#EA5555</code> is already 3.54:1.","Hover must never move the top face, or the pointer un-hovers itself."] },
  { id:"A3", name:"Typeface on board surfaces", file:S1+"type-board.html", status:"signed",
    decides:["Manrope, superseding Inter and Plus Jakarta Sans.","Six roles read verbatim from <code>tokens/typography.tokens.json</code>.","Every candidate has real tabular figures — only 11–13px legibility ever selected anything."],
    watch:["The counts stack (<code>2/3</code>, <code>10/12</code>, <code>11/14</code>) is the tabular claim made checkable — the digits must align.","Judge it on the board surfaces, not the form controls: that was G8's whole complaint."] },
  { id:"A4", name:"State borders, per theme", file:S1+"borders-v2.html",
    decides:["All four border states derived per theme from <code>--border</code>, never borrowed from a fill token.","Light and dark shown together."],
    watch:["A state that borrows a fill token drifts the moment the fill changes.","Check dark: the demoted shadow is gone there, so the border is carrying the whole edge."] },

  { grp:"Card state & motion" },
  { id:"A5", name:"Drag choreography", file:S1+"drag-v3.html",
    decides:["<code>DragOverlay</code> carries the card above the list; lift is <code>scale(1.03)</code> + real shadow, <b>no rotation</b>.","Source slot collapses to a dashed ghost over ~180ms.","Drop settles over ~160ms on <code>--e</code> rather than snapping."],
    watch:["The drop settle is the single largest perceived-quality change in the phase — watch the release, not the lift.","The card must be grabbable again from frame 1 of its settle (rule 5).","The dashed slot should dissolve through opacity, not vanish (defect log row 20)."] },
  { id:"A6", name:"Optimistic state", file:S1+"optimistic-v5.html",
    decides:["In flight = border tint only. Settled = tint releases ~200ms + one ring pulse.","Rolled back = the card travels back ~220ms, tint decays ~500ms.","The 2px indeterminate 'wire' is dropped — most PATCHes resolve under 200ms."],
    watch:["Exactly <b>one</b> settle ring — v5 exists because v4 drew it twice.","Rollback is rule 2's licensed exception: it may move, because something genuinely un-happened."] },

  { grp:"Transitions" },
  { id:"A7", name:"Card → task detail morph", file:S1+"morph-real.html",
    decides:["Real <code>document.startViewTransition()</code>, not a CSS simulation.","The column does not reflow — the card's box is never mutated."],
    watch:["Scroll the column first, <b>then</b> open a card — a fresh page holds every dangerous quantity at zero.","The API blocks pointer input for its full duration. That is one of rule 5's only two exceptions."] },
  { id:"A8", name:"Board → board switch", file:S1+"board-switch-v3.html",
    decides:["Directional and streaming — the direction comes from which board you moved to.","Skeleton→content handoff reuses the same 0 / 70 / 110 / 180ms timing."],
    watch:["<b>This is a CSS simulation — zero calls to the real API.</b> It must be re-proven against <code>startViewTransition</code> before shipping.","How it coexists with the non-directional board delete (A14) is still unreconciled."] },
  { id:"A9", name:"The board title well", file:S1+"title.html",
    decides:["A rename swaps in <b>one frame</b>; only a switch slides.","The slide is masked inside a fixed well, 180ms out against 200ms in.","Crossfade rejected: 9 frames with both strings inked in the same place."],
    watch:["Rule 4 — text never crossfades. Any frame showing two strings at once is the defect.","A rename has no direction, so a slide there would invent one."] },
  { id:"A10", name:"Task panel — open, and A → B", file:S1+"task-open-v17.html", status:"signed",
    decides:["Docking is <b>overlay</b>; the board never moves, and <code>scrollIntoView</code> is off.","Panel A → panel B is <code>startViewTransition()</code>, adopted over a measured 320–352ms objection.","17 named units, of which only 8 animate on a swap."],
    watch:["Swap between two tasks whose titles differ a lot, then two that barely differ — an unchanged slot must be invisible, not blink.","Tick a subtask and watch the counter: it updates named spans, because a <code>textContent</code> write deletes them.","Open from a mid-scrolled column: the board must not move a pixel."] },

  { grp:"Layout surfaces" },
  { id:"A11", name:"Sidebar collapse / expand", file:S2+"sidebar.html",
    decides:["Width 300 → 0 over 220ms on <code>--e</code>; the content region is <code>flex-1</code> so it flows in for free.","A fixed-width inner inside <code>overflow: hidden</code>, or the caption reflows 66px → 102px and wraps.","Collapsed is a full hide — the 72px icon rail was rejected."],
    watch:["The expand control is live from frame 0 at opacity 0 — try clicking it <i>while</i> the panel is still closing.","The right-hand header cluster must hold perfectly still (measured: x = 934.5 at every sample)."] },
  { id:"A12", name:"Dashboard header", file:S2+"header.html",
    decides:["Disabled is its own token trio (<code>--bg-app</code> / <code>--text-muted</code> / <code>--border</code>), so it rides the existing 130ms colour transition.","No scroll-elevation: nothing ever scrolls under the header."],
    watch:["Opacity must never leave 1 — the old <code>1 → 0.5</code> jump had zero intermediate frames.","The label must stay readable through the whole disabled walk."] },
  { id:"A13", name:"Column CRUD", file:S1+"column-crud-v17.html", status:"signed",
    decides:["One surface for create · rename · delete · reorder: 34px rail + header button, inline rename, view-transition delete, DragOverlay reorder.","26 logged defects were fixed against it."],
    watch:["Reorder with the board scrolled and with only two columns — the flapping fix was needed for exactly that.","Rename commits on Enter, cancels on Esc, and the element is never swapped.","Delete the last column: the empty state must arrive, not a gap."] },
  { id:"A14", name:"Board rename + delete", file:S1+"board-edit-v2.html", status:"signed",
    decides:["Inline <code>contenteditable</code> rename from the kebab — <b><code>EditBoardModal</code> is deleted by this</b>.","Delete runs the row, the rail and the board swap through <b>one</b> <code>startViewTransition</code>.","Rollback returns the row to <code>afterBoardId</code> with a fading danger tint."],
    watch:["Delete a <b>background</b> board and then the <b>open</b> one — they are two different cases from one action.","Nothing should override the UA cross-fade: a custom curve is what made unchanged text fade in earlier versions."] },
  { id:"A15", name:"Sidebar board list + create", file:S1+"sidebar-boards-v4.html", status:"signed",
    decides:["36px rows 2px apart, 4px radius; selected = 2px purple left rail + tint + weight.","Monogram hue hashed from <code>board.id</code>, never the index.","No per-board count — the data model has no notion of a done task."],
    watch:["Eight boards is the case that matters: 519px today against 383px adopted.","The column outline is collapsed by default and capped at 6.","Create a board and watch the row arrive — v3's disclosure never animated at all (1 frame over 0ms)."] },

  { grp:"Overlays" },
  { id:"A16", name:"Dropdown & Menu", file:S2+"menu-v2.html",
    decides:["Opacity only, no scale. 70ms in / 120ms out on <code>cubic-bezier(0,.85,.25,1)</code>.","Legible at 55ms; Base UI needs zero lines of exit state."],
    watch:["Click straight <i>through</i> the fade at a known item — the first item is hit-testable at 28ms, at opacity 0.","A programmatic click will not animate: Base UI reads <code>detail === 0</code> as keyboard activation."] },
  { id:"A17", name:"Modal enter / exit", file:S1+"modal-motion-v4.html", status:"signed",
    decides:["Enter: opacity 90ms linear; translate 18px→0, scale .96→1 and shadow all 300ms on <code>--enter</code>.","Backdrop: opacity 220ms + blur(0)→blur(1.5px) 260ms.","Exit: 130ms on <code>--exit</code>, popup and backdrop on <b>one</b> clock."],
    watch:["The exit is the half that gets skimped — watch it at 6×.","The reduced variant must not become <code>transition: none</code>, or Base UI unmounts in ~18ms and the popup vanishes mid-scrim.","A long form must keep its title and submit button pinned while only the middle scrolls."] },
  { id:"A18", name:"Toast accent stripe", file:S1+"toast-v3.html",
    decides:["Inset pill stripe: left 6px, width 3px, radius 2px, 12px clear top and bottom, 7px to text.","Content inset becomes symmetric 16 / 16."],
    watch:["Today every toast — danger or not — reserves 4px it may not use. The asymmetry is the thing being fixed.","Nothing should touch a corner; the old stripe curved through its whole top and bottom."] },
  { id:"A19", name:"Toast motion + the queue", file:S1+"toast-motion-v1.html", status:"signed",
    decides:["Two exits: a timeout <b>fades</b> (200ms linear); a dismiss <b>leaves</b> (opacity + 10px + scale .98, 130ms <code>--exit</code>).","<code>limit</code> is a window over a queue: three visible, the rest mounted and promoted newest-first.","The pile stays silent about the queue — no “+N waiting” row."],
    watch:["Raise 8 and close them one at a time — all 8 must surface, in order.","Hover a toast: its timer pauses, and does not restart twice on leave.","A promotion should begin while the leaving toast is still on screen."] },

  { grp:"CRUD surfaces" },
  { id:"A20", name:"Task create", file:S1+"task-create-v4.html", status:"signed",
    decides:["The adopted button treatment in situ, inside the modal motion of A17.","The modal closes on submit; the card arrives optimistically."],
    watch:["Submit with the column already scrolled, and with an empty column.","The modal exit and the card's arrival are one frame, not two clocks."] },
  { id:"A21", name:"Task delete", file:S1+"task-delete-v1.html", status:"signed",
    decides:["The delete is <b>optimistic</b> — the card goes on submit and comes back if the server refuses.","The row collapses via wrapper height → 0, never a FLIP.","Restore has three anchor cases: prepend, after-anchor, and append when the anchor is gone."],
    watch:["Set the rig to <i>refuses</i> and watch the card come back <b>where it was</b> — including deleting the first card, and the last.","No frame may show a card overlapping the one moving up into its place.","The column count follows the model, not the animation."] },
  { id:"A22", name:"Subtask create · rename · delete", file:S1+"subtask-crud-v2.html", status:"signed",
    decides:["Labels become editable in place; a row leaves by collapsing its wrapper.","A done subtask strikes through over 280ms and sinks via <code>translate</code> 240ms.","Reordering is flex <code>order</code>, never a re-append."],
    watch:["Tick a row that has already been moved once — a stable tiebreak on DOM index threw an unrelated row the length of the list.","Delete the row directly above the one you are editing.","Leaving sequences contents then box; entering does the box then contents."] },

  { grp:"Landing, auth & loading" },
  { id:"A23", name:"Auth form — opens on sign-up", file:S1+"form-v2.html",
    decides:["<b>Sign-up is the default screen</b>; the sign-in variant is the toggle (changed 2026-09-10).","The alt line under the submit is part of the swap — it is the only route to the other screen.","Two fields is the whole contract; everything here is craft on what exists."],
    watch:["Toggle to sign-in and back — the heading, submit label, alt line, name field, meter, <code>autocomplete</code> and the password hint must all follow.","Type a bad email, then press submit while pending — the label must say <i>Creating…</i>, not <i>Signing in…</i>.","Tab through the whole form: focus is a 2px border already present at rest."] },
  { id:"A23b", name:"Which screen the root leads to", file:S1+"auth-v4.html",
    decides:["The root leads with <b>Create Account</b>, and <code>/</code> resolves to <code>/register</code>.","This supersedes this prototype's own recorded option — <i>“delete it, redirect / to /login”</i>."],
    watch:["The panes here are a comparison board, not a live form — judge the shape, not the copy.","These screens still need their own UI-SPEC; the landing copy is a placeholder."] },
  { id:"A24", name:"Form controls", file:S1+"controls-v3.html",
    decides:["Focus is one 2px border that exists at rest; only its colour changes.","Caps-lock and error treatments; the five-way font switcher lives here."],
    watch:["No ring, no halo — the rejected candidate read as three concentric edges.","Type a bad email and watch the error arrive without the field changing size."] },
  { id:"A25", name:"Password rules", file:S1+"pwrules-v2.html",
    decides:["A chips row rather than a vertical checklist, which cost +42px.","The strength meter was withdrawn as decoration."],
    watch:["The row must not grow the form as rules pass and fail."] },
  { id:"A27", name:"Landing page", file:S1+"landing-v2.html",
    decides:["Three columns that <b>fit inside the backdrop</b> — the fourth under a fade read as cropped.","Every mock card stays single-line: the gap shift is 47px, which is one card's height.","The flyer's travel is <code>var(--pitch)</code>, never a literal."],
    watch:["Watch a full 7s loop: no card may sit on top of another as the gap opens and closes.","The dotted backdrop must reach the left pane's edge — it was covered by 69px of it.","Both CTAs are real buttons of equal weight, Create account first."] },
  { id:"A26", name:"Skeleton → content handoff", file:S1+"handoff-v4.html",
    decides:["Stagger 0ms, skeleton out 70ms, content in 110ms, whole board settled 180ms.","Overlap is impossible by construction — content cannot start before its own skeleton finishes.","No rising translateY on entry."],
    watch:["No column may show skeleton and content at once — the rejected whole-layer crossfade scored 1.00 on exactly that.","The rejected candidate took 880ms. Judge whether 180ms reads as arriving or as a cut.","<code>load2-v2</code> is the companion for the quieter drop zone."] },
];

const STORE = "phase5-review-v1";
const state = JSON.parse(localStorage.getItem(STORE) || "{}");
const items = ROWS.filter((r) => r.id);
let cur = 0;

const $ = (id) => document.getElementById(id);
const save = () => localStorage.setItem(STORE, JSON.stringify(state));

function buildRail() {
  const list = $("list");
  list.innerHTML = "";
  for (const r of ROWS) {
    if (!r.id) {
      const g = document.createElement("div");
      g.className = "grp";
      g.textContent = r.grp;
      list.append(g);
      continue;
    }
    const el = document.createElement("div");
    el.className = "row";
    el.dataset.id = r.id;
    el.innerHTML = `<span class="id">${r.id}</span><span class="nm">${r.name}</span><span class="dot"></span>`;
    el.onclick = () => show(items.indexOf(r));
    list.append(el);
  }
}

function paintRail() {
  let done = 0;
  for (const r of items) {
    const el = document.querySelector(`.row[data-id="${r.id}"]`);
    const v = state[r.id]?.v ?? "";
    el.dataset.v = v;
    el.dataset.on = String(items[cur].id === r.id);
    if (v === "ok" || v === "no") done += 1;
  }
  $("prog").firstElementChild.style.width = `${(done / items.length) * 100}%`;
  $("progtxt").textContent = `${done} / ${items.length} decided`;
}

/* The rig lives inside the prototype, so the toolbar drives its checkbox rather than a second one. */
function rig(which) {
  const doc = $("frame").contentDocument;
  const box = doc && doc.getElementById(which);
  if (!box) return null;
  box.checked = !box.checked;
  box.dispatchEvent(new Event("change", { bubbles: true }));
  return box.checked;
}

function reflectRig() {
  const doc = $("frame").contentDocument;
  const has = (id) => Boolean(doc && doc.getElementById(id));
  $("slowbtn").disabled = !has("slow");
  $("reducedbtn").disabled = !has("reduced");
  $("slowbtn").dataset.on = String(Boolean(doc?.getElementById("slow")?.checked));
  $("reducedbtn").dataset.on = String(Boolean(doc?.getElementById("reduced")?.checked));
  $("noslow").style.display = has("slow") ? "none" : "block";
}

function show(i) {
  cur = (i + items.length) % items.length;
  const r = items[cur];
  $("title").textContent = `${r.id} · ${r.name}`;
  $("path").textContent = r.file;
  $("status").textContent = r.status === "signed" ? "signed off" : "adopted";
  $("status").dataset.s = r.status === "signed" ? "signed" : "";
  $("decides").innerHTML = r.decides.map((d) => `<li>${d}</li>`).join("");
  $("watch").innerHTML = r.watch.map((d) => `<li>${d}</li>`).join("");
  $("frame").src = r.file;
  $("note").value = state[r.id]?.note ?? "";
  for (const b of document.querySelectorAll("#verdict .btns button")) {
    b.dataset.on = String(b.dataset.v === state[r.id]?.v);
  }
  paintRail();
  document.querySelector(`.row[data-id="${r.id}"]`)?.scrollIntoView({ block: "nearest" });
}

function setVerdict(v) {
  const id = items[cur].id;
  state[id] = { ...(state[id] ?? {}), v: state[id]?.v === v ? "" : v };
  save();
  for (const b of document.querySelectorAll("#verdict .btns button")) {
    b.dataset.on = String(b.dataset.v === state[id].v);
  }
  paintRail();
}

/* Markdown, so a verdict can be pasted straight back into the session that acts on it. */
function report() {
  const line = (r) => {
    const s = state[r.id] ?? {};
    const mark = { ok: "approved", no: "REWORK", wait: "unsure" }[s.v] ?? "not reviewed";
    const note = s.note?.trim() ? ` — ${s.note.trim().replace(/\s+/g, " ")}` : "";
    return `- **${r.id} ${r.name}** (\`${r.file}\`): ${mark}${note}`;
  };
  const rework = items.filter((r) => state[r.id]?.v === "no");
  const text = [
    `# Phase 5 review — ${new Date().toISOString().slice(0, 10)}`,
    "",
    ...items.map(line),
    "",
    rework.length ? `**Rework: ${rework.map((r) => r.id).join(", ")}**` : "**Nothing marked rework.**",
  ].join("\n");
  navigator.clipboard.writeText(text).then(
    () => { $("report").textContent = "copied ✓"; setTimeout(() => ($("report").textContent = "copy report"), 1400); },
    () => window.prompt("Copy this:", text),
  );
}

buildRail();
show(0);

$("frame").addEventListener("load", reflectRig);
$("note").addEventListener("input", () => {
  const id = items[cur].id;
  state[id] = { ...(state[id] ?? {}), note: $("note").value };
  save();
});
for (const b of document.querySelectorAll("#verdict .btns button")) {
  b.onclick = () => setVerdict(b.dataset.v);
}
$("slowbtn").onclick = () => { rig("slow"); reflectRig(); };
$("reducedbtn").onclick = () => { rig("reduced"); reflectRig(); };
$("replay").onclick = () => { $("frame").src = items[cur].file; };
$("open").onclick = () => window.open(items[cur].file, "_blank");
$("report").onclick = report;

addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.metaKey || e.ctrlKey || e.altKey) return;
  const keys = {
    j: () => show(cur + 1), ArrowDown: () => show(cur + 1),
    k: () => show(cur - 1), ArrowUp: () => show(cur - 1),
    a: () => setVerdict("ok"), r: () => setVerdict("no"), u: () => setVerdict("wait"),
    s: () => { rig("slow"); reflectRig(); },
    Enter: () => { $("frame").src = items[cur].file; },
  };
  if (keys[e.key]) { e.preventDefault(); keys[e.key](); }
});
</script>
</body>
</html>
