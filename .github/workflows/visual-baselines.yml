name: Visual baselines

on:
    workflow_dispatch: {}

env:
    NEXT_TELEMETRY_DISABLED: "1"

permissions:
    contents: write
    pull-requests: write

jobs:
    update-baselines:
        # Guard: dispatching against any ref other than master would silently mint that
        # ref's (possibly unreviewed/buggy) rendering as the new "ground truth" baseline —
        # restrict generation to master so a stray branch can never poison the baselines.
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "pnpm"

            - run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium

            - name: Build Storybook
              run: pnpm build-storybook

            - name: Update visual baselines
              run: pnpm exec playwright test --project visual --update-snapshots

            - name: Upload baselines (debug artifact)
              uses: actions/upload-artifact@v4
              with:
                  name: visual-baselines
                  path: visual/__screenshots__/**
                  retention-days: 7

            # Even restricted to master, the run's own screenshots could reflect an
            # unreviewed visual bug already on master at dispatch time — so the new
            # baselines are never committed directly. They land on a fresh branch and
            # a PR is opened; GitHub's PR UI renders image diffs, giving a human an
            # actual before/after to review before any baseline becomes "ground truth".
            - name: Open PR with updated baselines (skips if nothing changed)
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [ -z "$(git status --porcelain -- visual/__screenshots__/)" ]; then
                    echo "No baseline changes — skipping PR."
                    exit 0
                  fi

                  BRANCH="visual-baselines-update-${{ github.run_number }}"
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git checkout -b "$BRANCH"
                  git add visual/__screenshots__/
                  git commit -m "chore: update visual regression baselines (run ${{ github.run_number }})"
                  git push origin "$BRANCH"
                  gh pr create \
                    --title "Update visual regression baselines (run ${{ github.run_number }})" \
                    --body "Auto-generated by the Visual baselines workflow, dispatched against master at ${{ github.sha }}. Review the image diffs below before merging — merging this PR is what promotes these screenshots to the new baseline ground truth." \
                    --base master \
                    --head "$BRANCH"
