name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

concurrency:
    group: "ci-${{ github.ref }}"
    cancel-in-progress: true

env:
    NEXT_TELEMETRY_DISABLED: "1"
    # The deployed nonprod backend's real address (GC-22: no mock server remains anywhere in the
    # codebase — every test layer and `pnpm build`/`pnpm test` dial this backend directly). Set
    # per environment, never a literal read anywhere else in source (ADR tech/0006); this is CI's
    # own environment value.
    EXTERNAL_API_BASE_URL: "https://kanban-board-rud-vlad-473-nonprod.duckdns.org/api"

jobs:
    # GC-06: the authoritative secret scan (D-26h — hooks are a convenience, CI is the gate).
    # No local pre-commit half exists for this control: the Task 1 checkpoint rejected both
    # candidate npm gitleaks wrappers on supply-chain grounds (single-maintainer, low-star
    # repackagings of a third-party binary), and this project has no devcontainer/direct-binary
    # convention to fall back on for a vetted local binary — see 01-18-SUMMARY.md. This job uses
    # the official gitleaks/gitleaks-action instead, which downloads and runs the real gitleaks
    # binary itself (no pnpm/Node steps needed — unlike the other jobs below, it isn't consuming
    # this project's own dependency tree). No `needs:` — a secret is worth reporting even when
    # the build is broken, and this scan is fast enough not to wait behind `quality`.
    secrets:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
              with:
                  # gitleaks-action diffs baseRef^..headRef from the push/PR event payload; a
                  # shallow checkout (the default `fetch-depth: 1` used by the other jobs below)
                  # would leave that history unreachable. This is the official usage pattern, not
                  # a full-history re-scan on every run — see the action's own README.
                  fetch-depth: 0

            - name: Scan for secrets
              uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "pnpm"

            - run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium

            # `app/(dashboard)/boards/[boardId]/page.tsx` types its params against Next.js's
            # generated `PageProps<"/boards/[boardId]">`, which only exists after typegen runs
            # (normally a `next build`/`next dev` side effect). Lint runs before Build in this
            # job, so without this step that type resolves as `any`, and
            # `@typescript-eslint/no-unsafe-assignment` fails on every value derived from it —
            # confirmed by reproducing locally with `.next/types` removed (same 3 errors, same
            # lines) and confirming this step + a bare `pnpm lint` passes clean.
            - name: Generate Next.js route types
              run: pnpm exec next typegen

            - name: Lint
              run: pnpm lint

            - name: Route declaration check
              run: pnpm routes:check

            - name: Route Handler ban check
              run: pnpm handlers:check

            - name: Story interaction-function ban check
              run: pnpm stories:check

            - name: TSX declaration scope check
              run: pnpm tsx:check

            # Prints its tracked docs/adr/tech/0025 exemptions on every run, pass or fail — the
            # carve-out is meant to be read in the log, not discovered by grepping the script.
            - name: Story-only render check
              run: pnpm renders:check

            - name: Format check
              run: pnpm format:check

            - name: Comment length check
              run: pnpm comments:check

            - name: API types drift
              run: |
                  pnpm api:generate
                  git diff --exit-code src/lib/core/api-contract/generated-types.ts

            # Pre-existing gap, not introduced by this plan (GC-23/reset wiring): `next build`'s
            # page-data collection imports session.ts for every Route Handler, and session.ts
            # throws at module-eval time when SESSION_SECRET is unset (ADR tech/0001, "a default
            # secret would fail silently, which is worse than a missing one"). This job has had no
            # SESSION_SECRET at all, so `pnpm build` below has been failing on every push since
            # before this plan (confirmed against a 2026-08-17 run, unrelated to plan 01-31's own
            # changes) — this plan's own acceptance criteria require a real green run to prove the
            # reset step, so the blocking gap is fixed here using the exact pattern the `e2e` job
            # below already uses for the same purpose.
            - name: Generate a workflow-scoped session secret
              run: echo "SESSION_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

            - name: Build
              run: pnpm build

            - name: Test
              run: pnpm test

            # GC-23/260829-kyv: `pnpm test`'s "node" project's own globalSetup/globalTeardown pair
            # (vitest-nonprod-cleanup.ts) already deletes what it seeded, so this is a no-op safety
            # net for a cancelled or crashed job, scoped to this job's own accounts, not a full wipe.
            - name: Clean up seeded nonprod accounts
              if: always()
              run: pnpm e2e:cleanup
              env:
                  NONPROD_RESET_TOKEN: ${{ secrets.NONPROD_RESET_TOKEN }}

    visual:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: quality
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "pnpm"

            - run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium

            - name: Build Storybook
              run: pnpm build-storybook

            - name: Run visual regression
              run: pnpm exec playwright test --project visual

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: quality
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "pnpm"

            - run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium

            # A fresh secret per run — real credential material, never committed, scoped to this
            # job only. Exported via GITHUB_ENV so it's visible to the E2E step below and, through
            # it, to playwright.config.ts's e2e webServer (which forwards it to `next start`).
            - name: Generate a workflow-scoped session secret
              run: echo "SESSION_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

            # `playwright.config.ts`'s `globalSetup` (`e2e/global-setup.ts`) now refuses to run the
            # suite at all without a working `NONPROD_RESET_TOKEN` — the same secret the "Reset
            # nonprod state" step below already reads, now also required by the Playwright process
            # itself as a precondition, not only for its own post-suite cleanup.
            - name: Run E2E tests
              run: pnpm exec playwright test --project e2e
              env:
                  NONPROD_RESET_TOKEN: ${{ secrets.NONPROD_RESET_TOKEN }}

            # GC-23/260829-kyv: `playwright.config.ts`'s own globalSetup/globalTeardown pair already
            # deletes what this run seeded, so this is a no-op safety net for a cancelled or crashed
            # job, scoped to this job's own accounts, not a full wipe.
            - name: Clean up seeded nonprod accounts
              if: always()
              run: pnpm e2e:cleanup
              env:
                  NONPROD_RESET_TOKEN: ${{ secrets.NONPROD_RESET_TOKEN }}

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-e2e-report
                  path: playwright-report/
                  retention-days: 7
