name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

concurrency:
    group: "ci-${{ github.ref }}"
    cancel-in-progress: true

env:
    NEXT_TELEMETRY_DISABLED: "1"
    # Local-mock server URL (docs/api/kanban-board-openapi.json's declared server URL). No real
    # backend exists yet — MSW intercepts every call this hits, in both `pnpm build` and `pnpm
    # test` (ADR tech/0006: per-environment, never a literal in source; this is CI's environment).
    EXTERNAL_API_BASE_URL: "http://localhost:8080/api"

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "pnpm"

            - run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium

            - name: Lint
              run: pnpm lint

            - name: Format check
              run: pnpm format:check

            - name: API types drift
              run: |
                  pnpm api:generate
                  git diff --exit-code src/lib/api/generated-types.ts

            - name: Build
              run: pnpm build

            - name: Test
              run: pnpm test

    visual:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: quality
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "pnpm"

            - run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium

            - name: Build Storybook
              run: pnpm build-storybook

            - name: Run visual regression
              run: pnpm exec playwright test

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
