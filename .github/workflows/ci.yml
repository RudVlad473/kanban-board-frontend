name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

concurrency:
    group: "ci-${{ github.ref }}"
    cancel-in-progress: true

env:
    NEXT_TELEMETRY_DISABLED: "1"
    # Local-mock server URL (docs/api/kanban-board-openapi.json's declared server URL). No real
    # backend exists yet — MSW intercepts every call this hits, in both `pnpm build` and `pnpm
    # test` (ADR tech/0006: per-environment, never a literal in source; this is CI's environment).
    EXTERNAL_API_BASE_URL: "http://localhost:8080/api"

jobs:
    # GC-06: the authoritative secret scan (D-26h — hooks are a convenience, CI is the gate).
    # No local pre-commit half exists for this control: the Task 1 checkpoint rejected both
    # candidate npm gitleaks wrappers on supply-chain grounds (single-maintainer, low-star
    # repackagings of a third-party binary), and this project has no devcontainer/direct-binary
    # convention to fall back on for a vetted local binary — see 01-18-SUMMARY.md. This job uses
    # the official gitleaks/gitleaks-action instead, which downloads and runs the real gitleaks
    # binary itself (no pnpm/Node steps needed — unlike the other jobs below, it isn't consuming
    # this project's own dependency tree). No `needs:` — a secret is worth reporting even when
    # the build is broken, and this scan is fast enough not to wait behind `quality`.
    secrets:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
              with:
                  # gitleaks-action diffs baseRef^..headRef from the push/PR event payload; a
                  # shallow checkout (the default `fetch-depth: 1` used by the other jobs below)
                  # would leave that history unreachable. This is the official usage pattern, not
                  # a full-history re-scan on every run — see the action's own README.
                  fetch-depth: 0

            - name: Scan for secrets
              uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "pnpm"

            - run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium

            - name: Lint
              run: pnpm lint

            - name: Route declaration check
              run: pnpm routes:check

            - name: Format check
              run: pnpm format:check

            - name: API types drift
              run: |
                  pnpm api:generate
                  git diff --exit-code src/lib/api/generated-types.ts

            - name: Build
              run: pnpm build

            - name: Test
              run: pnpm test

    visual:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: quality
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "pnpm"

            - run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium

            - name: Build Storybook
              run: pnpm build-storybook

            - name: Run visual regression
              run: pnpm exec playwright test --project visual

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: quality
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "pnpm"

            - run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium

            # A fresh secret per run — real credential material, never committed, scoped to this
            # job only. Exported via GITHUB_ENV so it's visible to the E2E step below and, through
            # it, to playwright.config.ts's e2e webServer (which forwards it to `next start`).
            - name: Generate a workflow-scoped session secret
              run: echo "SESSION_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

            - name: Run E2E tests
              run: pnpm exec playwright test --project e2e

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-e2e-report
                  path: playwright-report/
                  retention-days: 7
